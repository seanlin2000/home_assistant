# SearXNG settings for the studio assistant.
# Only the keys that differ from the image defaults are listed; everything else is inherited.
use_default_settings:
  engines:
    # One front door per independent index, measured on 2026-10-09. DuckDuckGo serves Bing's index. Bing's own engine is left out: without a
    # browser it answers many queries with results for the first word only ("best hiking trails" gives Best Buy), from Docker and from the Mac
    # alike. Brave has its own index but answers this address "too many requests"; it stays in case that lifts. Google's index has no working
    # door: SearXNG's google engine calls a retired endpoint, and the image marks startpage inactive (proof-of-work CAPTCHA).
    keep_only:
      - duckduckgo
      - brave
      - wikipedia

general:
  instance_name: "studio-search"
  debug: false

server:
  # The secret is injected from the SEARXNG_SECRET environment variable (see docker-compose.yml).
  secret_key: "replaced-by-SEARXNG_SECRET-environment-variable"
  # The rate limiter is meant for public instances; this one is reachable only from localhost.
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  default_lang: "en"
  # json is what web_search_mcp consumes; html keeps the web UI usable for debugging.
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
