# SearXNG settings for the studio assistant.
# Only the keys that differ from the image defaults are listed; everything else is inherited.
use_default_settings:
  engines:
    keep_only:
      # The big four scrape-based engines block a single home address after bursts (Google needs JavaScript since 2026-09,
      # Brave rate-limits, DuckDuckGo answers with a CAPTCHA page); the smaller engines below keep search alive when they do.
      - google
      - bing
      - brave
      - duckduckgo
      - mojeek
      - qwant
      - startpage
      - yahoo
      - wikipedia

general:
  instance_name: "studio-search"
  debug: false

server:
  # The secret is injected from the SEARXNG_SECRET environment variable (see docker-compose.yml).
  secret_key: "replaced-by-SEARXNG_SECRET-environment-variable"
  # The rate limiter is meant for public instances; this one is reachable only from localhost.
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  default_lang: "en"
  # json is what web_search_mcp consumes; html keeps the web UI usable for debugging.
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
