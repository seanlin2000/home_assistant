name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @mermaid-js/mermaid-cli@11.17.0
      - run: uv sync --locked --no-group voice
      - name: Name the diagram cache after the drawing code, the installed mermaid-cli packages, and the runner image
        id: diagram-cache
        run: |
          key_prefix="$(scripts/diagram_cache_key.sh)"
          echo "key-prefix=$key_prefix" >> "$GITHUB_OUTPUT"
      - name: Restore the diagrams the newest earlier run drew with the same code and renderer (this run saves its own at the end)
        uses: actions/cache@v4
        with:
          path: .cache/manual_diagrams
          key: ${{ steps.diagram-cache.outputs.key-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.diagram-cache.outputs.key-prefix }}
      - name: Build the operator manual with warnings as errors
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
