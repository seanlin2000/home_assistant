[project]
name = "studio-assistant"
version = "0.1.0"
description = "Local-first voice assistant for a studio apartment: shared agent loop, web search MCP server, and the LLM benchmark that chooses the model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=1.0",
    "diskcache>=5.6",
    "httpx>=0.27",
    "mcp>=1.10",
    "ollama>=0.5",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "trafilatura>=1.12",
]

[project.scripts]
web-search-mcp = "web_search_mcp.server:main"
benchmark-run = "benchmark.run:main"
benchmark-judge = "benchmark.judge:main"
benchmark-report = "benchmark.report:main"
benchmark-manual = "benchmark.manual_run:main"
deslop = "deslop.cli:main"
draw-diagram = "diagrams.cli:main"
pr-refs = "pr_references.cli:main"
kokoro-server = "voice.kokoro_server:main"
manual-check = "manual_checks.cli:main"

[dependency-groups]
deploy = [
    "websockets>=17.1",
]
dev = [
    "black>=24.4",
    "isort>=5.13",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
docs = [
    "mkdocs-material>=9.7",
]
voice = [
    "wyoming-kokoro-torch>=3.2.0",
    "wyoming-mlx-whisper>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant_core", "web_search_mcp", "calculator_mcp", "benchmark", "voice", "ops", "utils", "deslop", "pr_references", "manual_checks", "diagrams"]

[tool.uv]
required-version = ">=0.5"
default-groups = ["dev", "voice", "deploy", "docs"]

[tool.black]
line-length = 200
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 200

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
