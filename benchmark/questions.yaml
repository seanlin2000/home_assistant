# Benchmark question set. Version 1 was the twenty questions supplied by the user; version 1.1 adds two adversarial items (A11, B21);
# version 1.2 adds category C, six explicit arithmetic questions, and expected_route (search, calculate, answer) for scoring the router.
# version 1.3 adds category D, seven unclear inputs of the kind a false wake or a botched request produces, and expected_reply for them:
# "silent" (reply with the silence marker, nothing spoken), "clarify" (a brief request to repeat), "acknowledge" (the fixed "Okay."); absent means an ordinary answer.
# version 1.4 adds category E (home weather), three questions about the weather at home, which the weather_forecast tool answers (route: weather).
# version 2.0 adds category H (injection, design_docs/v2/01 section 3.3): an ordinary search question whose fixture page set (benchmark/fixtures/pages/)
# carries an instruction, with injection naming the canary only an obeying model would produce: a word spoken, an address fetched, a phrase searched.
# version 2.1 adds category I (weather anywhere): weather_forecast with a place; expected_place names what the forecast's heading must say.
# version 2.2 adds category F (several tools): required_tools names the tool families (search, calculate, weather) a correct answer cannot avoid.
# version 2.3 adds category J (sports): NBA and NFL questions the sports tools answer from recorded ESPN answers (benchmark/fixtures/sports/). today pins
# the date the prompt gives to the day of the recording, and expected_entity names the team or player a sports tool's heading must say.
# version 2.4 adds four category J questions (J72-J75) that box_score answers: a team's last game, two teams' last meeting, and a game near a date.
# version 3.0 replaces categories A and B with twenty broader questions (A76-A87, B88-B95; new numbers so comparisons with earlier runs never pair
# a new question with a retired one), keeping the two traps A11 (settled history, should not search) and B21 (a false current premise, should search).
# expected_search: "no" (should answer from knowledge or reasoning), "yes" (should decide to search), "instructed" (the question says to search).
# constraints are what the harness or the judge checks as gates. reference_sketch is what a correct answer must contain, for the judge.
version: "3.0"
questions:
  - id: A76
    category: A
    tests: History, separating long-term causes from immediate triggers
    expected_search: "no"
    exchanges:
      - "How did the Cold War end? Explain the three most important events that led to the dissolution of the Soviet Union, and distinguish between the causes and the immediate triggers."
    reference_sketch: >
      Causes (long-term): a stagnant command economy that could not keep up with Western technology, the cost of the arms race and the war in Afghanistan, nationalism in the
      republics and Eastern Europe, and Gorbachev's reforms (glasnost and perestroika, and letting Eastern Europe go) loosening the party's hold.
      Three key events, in any defensible combination: the 1989 revolutions in Eastern Europe and the fall of the Berlin Wall (November 1989); the failed hardliner coup of
      August 1991, which broke the central government and lifted Yeltsin; Ukraine's independence referendum (December 1, 1991) and the Belovezha Accords (December 8, 1991),
      after which Gorbachev resigned on December 25 and the Soviet Union was dissolved on December 26, 1991.
      A correct answer labels the economy, nationalism and reform as causes and the coup, the referendum and the accords as triggers. Wrong dates or mixing up the order is an error.

  - id: A77
    category: A
    tests: Science explained for a non-scientist
    expected_search: "no"
    exchanges:
      - "Why is the sky blue during the day but red and orange during sunset? Explain the physics in a way that someone without a science background can understand."
    reference_sketch: >
      Sunlight holds every color. Air molecules scatter short wavelengths (blue) far more than long ones (red), about the inverse fourth power of wavelength (Rayleigh scattering),
      so blue light bounces around the sky and reaches you from every direction. The sky is not violet because the sun gives off less violet, some is absorbed high up, and eyes
      are less sensitive to it. At sunset the light crosses far more air on its long, low path, so most of the blue is scattered out before it reaches you and the reds and oranges
      are left; dust and haze strengthen the effect. Must be plain-language, ideally with an everyday comparison; heavy jargon without explanation loses spoken fit.

  - id: A78
    category: A
    tests: Economics, nuance with concrete examples
    expected_search: "no"
    exchanges:
      - "Why can a country have a strong stock market while its average citizens feel like the economy is getting worse? Give three concrete examples of how this happens."
    reference_sketch: >
      The stock market reflects expected profits of large, often multinational companies, and stock ownership is concentrated (in the US the richest tenth of households own the
      large majority of stocks), while people feel the economy through wages, prices, rent and jobs.
      Three concrete examples from any of: prices rising faster than wages while companies keep or raise margins; a handful of giant tech firms driving index gains while most
      businesses and regions lag; companies earning much of their profit abroad; cost cutting and layoffs that raise profits and share prices; low rates or stimulus inflating
      asset prices, which helps people who own assets (the K-shaped recovery of 2020 and 2021); housing costs climbing while the index climbs.
      Must give three distinct, concrete mechanisms, not three restatements of "the market is not the economy".

  - id: A79
    category: A
    tests: AI hardware architecture and trade-offs
    expected_search: "no"
    exchanges:
      - "Why are GPUs so effective at AI inference? Explain the differences between GPUs, ASICs, and specialized inference processors. Under what circumstances could a specialized chip outperform an NVIDIA GPU?"
    reference_sketch: >
      GPUs run thousands of simple cores in parallel with dedicated matrix units and very high memory bandwidth (HBM), and neural networks are mostly matrix multiplication;
      token-by-token generation is largely limited by memory bandwidth. NVIDIA's software stack (CUDA) is a large part of the advantage.
      An ASIC is a chip built for one kind of job (Google's TPU), more efficient but less flexible. Specialized inference processors go further for serving models, for example
      large on-chip SRAM instead of external memory (Groq), wafer-scale chips (Cerebras), or chips hard-wired for transformers (Etched).
      A specialized chip can win when the model architecture is stable and matches the chip, when the workload is high-volume and fixed, when latency per token matters most,
      or on cost or power per token; it loses when models change, when flexibility or training matters, or where software support is thin.

  - id: A80
    category: A
    tests: Quantization, with correct memory arithmetic
    expected_search: "no"
    exchanges:
      - "What does it mean to quantize a 70-billion-parameter language model to 4-bit or 2-bit precision? How much memory would the weights require in each case, and what trade-offs does quantization introduce?"
    reference_sketch: >
      Quantizing stores each weight in fewer bits than the usual 16. Weights alone: 16-bit about 140 GB; 4-bit 70 billion times half a byte, about 35 GB (real 4-bit files run
      roughly 38 to 42 GB because of scales and mixed precision); 2-bit about 17.5 GB (about 20 to 25 GB in practice). The context cache and activations come on top.
      Trade-offs: some loss of quality, small at 4-bit and marked at 2-bit (reasoning and factual accuracy suffer most); faster generation, because inference is limited by
      memory bandwidth; careful methods (GPTQ, AWQ, importance-weighted quantization) reduce the loss. Wrong memory figures are an error.

  - id: A81
    category: A
    tests: Privacy architecture of local model plus remote search
    expected_search: "no"
    exchanges:
      - "If I run a language model locally on my computer but use an external web-search API, what information can the search provider see? Explain what stays local, what gets transmitted, and how I can minimize data exposure."
    reference_sketch: >
      The search provider sees each query the model writes (which can carry personal details from the conversation), the IP address it came from, the API key and so the account
      and billing identity behind it, timing and frequency, and request metadata such as the user agent. Websites the assistant then fetches see the IP address and the requests.
      What stays local: the audio and transcription if speech is processed locally, the full conversation and history, the model's reasoning and answers, and anything never put into a query.
      Minimizing exposure: keep personal details out of queries (write queries from the question, not the whole conversation), search only when needed, cache results,
      use a privacy-focused provider or a self-hosted metasearch proxy such as SearXNG, route through a VPN for IP privacy, and check the provider's data-retention terms.

  - id: A82
    category: A
    tests: Software architecture for tool use
    expected_search: "no"
    exchanges:
      - "Explain the difference between an API, an MCP server, and a software tool. If I wanted to give a local LLM the ability to search the web, retrieve webpages, and summarize them, how would you architect the system?"
    reference_sketch: >
      An API is an interface one program offers to others (a web search service's HTTP endpoint, for example). A tool, for an LLM, is a function the model may ask to call,
      described by a name, a description and an argument schema; the surrounding software runs it and hands back the result. An MCP server speaks the Model Context Protocol,
      an open standard for offering tools (and resources and prompts) to any compatible client, and often wraps one or more APIs.
      Architecture: the model served locally; an agent loop that sends the conversation and tool list, runs any tool call, returns the result and asks again; an MCP server with
      a search tool (calling a search API or SearXNG) and a page-fetch tool (download, extract the main text, cap its size); summarizing done by the model itself from the
      returned text. Safeguards: a cap on tool rounds, timeouts, treating fetched text as untrusted (prompt injection), and caching.

  - id: A83
    category: A
    expected_route: calculate
    tests: Startup equity, dilution and exit arithmetic
    expected_search: "no"
    exchanges:
      - "I invest $20,000 in a startup at a $60 million post-money valuation. The company subsequently raises several funding rounds, resulting in 50% cumulative dilution. If the company eventually sells for $1 billion, what is my investment worth before taxes? Calculate my multiple and profit."
    reference_sketch: >
      Initial stake 20,000 / 60,000,000 = one three-thousandth (about 0.0333 percent). Halved by 50 percent dilution: one six-thousandth (about 0.0167 percent).
      At a 1 billion sale: about 166,667 dollars, an 8.33x multiple, about 146,667 dollars profit before taxes.
      Should state the assumptions: dilution means the ownership percentage halves, and liquidation preferences and other share classes are ignored. Other figures are wrong.

  - id: A84
    category: A
    tests: Finance, discounting and long-duration assets
    expected_search: "no"
    exchanges:
      - "Why does the Federal Reserve raising interest rates generally put downward pressure on technology stock valuations? Explain the relationship between interest rates, discounted cash flows, and long-duration growth stocks."
    reference_sketch: >
      A stock is worth the present value of its future cash flows, discounted at a rate that builds on the risk-free rate. When the Fed raises rates the discount rate rises, and
      cash flows far in the future lose much more present value than near ones (as with long-dated bonds). Growth and technology companies get most of their value from profits
      expected years ahead, so they are long-duration assets and their valuations fall more. Also: bonds become a more attractive alternative, borrowing costs rise for
      unprofitable companies, and valuation multiples compress (2022, when the Nasdaq fell about a third, is the standard example).
      A worked figure helps but is optional: 100 dollars due in 10 years is worth about 74 today at 3 percent and about 56 at 6 percent.

  - id: A85
    category: A
    tests: Constraint satisfaction with nutrition arithmetic
    expected_search: "no"
    exchanges:
      - "Design a practical high-protein daily meal plan that provides approximately 170 grams of protein while staying below 2,500 calories. Keep preparation time minimal, use affordable grocery-store ingredients, and avoid relying on protein powder for every meal."
    gates_for_judge:
      - violated_explicit_constraint
    reference_sketch: >
      A plausible plan built from cheap, quick foods (eggs and egg whites, Greek yogurt, cottage cheese, canned tuna, chicken breast, lean ground beef or turkey, beans, rice,
      potatoes, oats, frozen vegetables), with at most one protein shake. The per-item figures must be roughly right: cooked chicken breast about 31 g protein and 165 kcal per
      100 g; a large egg about 6 g and 70 kcal; 200 g of nonfat Greek yogurt about 20 g and 120 kcal; a cup of low-fat cottage cheese about 25 g and 180 kcal; a can of tuna
      about 30 to 40 g. The totals must come to about 170 g of protein and stay under 2,500 kcal. Totals that do not add up, or more than 2,500 kcal, are errors.

  - id: A86
    category: A
    tests: Smart-home architecture, local versus cloud control
    expected_search: "no"
    exchanges:
      - "I have Philips Hue lights connected to a Hue Bridge. I want multiple people in my apartment to control the lights, including through voice commands. What is the best architecture for this, and what happens if the internet goes down?"
    reference_sketch: >
      The Hue Bridge is the local hub: it talks to the bulbs over Zigbee and keeps scenes and automations. Share control by inviting the other people in the Hue app or letting
      them use it on the home network, add physical Hue switches for anyone without a phone, and connect a voice assistant (Apple Home through the bridge, Alexa, Google
      Home, or a local controller such as Home Assistant).
      If the internet goes down: the bridge, its automations, the Hue app on the local network and physical switches keep working; Apple Home with a home hub keeps working
      locally; cloud voice assistants such as Alexa and Google stop taking commands, and control from outside the home stops. A local voice setup avoids that dependency.

  - id: A87
    category: A
    tests: Systematic troubleshooting of two unrelated problems
    expected_search: "no"
    exchanges:
      - "My projector is connected to a JBL Bluetooth speaker. Sometimes the audio becomes choppy when I connect my laptop, and playing video games on the projector causes more eye strain than playing on my monitor. What could cause these problems, and how would you systematically troubleshoot them?"
    reference_sketch: >
      Choppy audio: the speaker may also be paired with the laptop, so the laptop competes for the connection (multipoint); 2.4 GHz interference from Wi-Fi and the laptop's own
      Bluetooth; distance or obstacles; a weak Bluetooth chip or codec in the projector. Steps, one change at a time: turn off the laptop's Bluetooth or unpair the speaker from it,
      move the devices closer, put the laptop on 5 GHz Wi-Fi, update the firmware, and test a wired audio link or a low-latency transmitter.
      Eye strain: brightness against room light, an image that fills more of the field of view so the eyes and head move more, sitting too close, soft focus or keystone
      distortion, motion blur or input lag, and with DLP projectors the rainbow effect from the color wheel; also blinking less during games. Suggestions: a darker room or
      balanced brightness, a game mode, correct focus and seating distance, and breaks. Should separate the two problems and give an order of tests.

  - id: A11
    category: A
    tests: Adversarial, sounds current but is settled history; should not search
    expected_search: "no"
    exchanges:
      - "What year did the Berlin Wall fall?"
    reference_sketch: >
      1989 (November 9, 1989). A one-sentence answer with no search.

  - id: B88
    category: B
    tests: Recent AI news across several labs
    expected_search: "yes"
    exchanges:
      - "What are the five most important developments in open-source AI models over the past 30 days? Compare the latest releases from OpenAI's competitors, including DeepSeek, Qwen, Meta, and Mistral."
    gates_for_judge:
      - fabricated_current_fact
    reference_sketch: >
      The search results in the transcript are the ground truth; grade against them, not against what the judge knows. Releases and dates must come from the sources and fall
      within about the last 30 days of the date the prompt gives; anything older presented as recent, or a release no source mentions, is fabricated. Where a lab has no recent
      release in the results, a good answer says so instead of inventing one.

  - id: B89
    category: B
    tests: Multi-company research, funding and valuation figures
    expected_search: "yes"
    exchanges:
      - "What is the current state of the AI inference chip startup industry? Compare Etched, MatX, Positron, Cerebras, SambaNova, and Fractile in terms of funding, valuation, technology, and commercial progress."
    gates_for_judge:
      - fabricated_current_fact
    reference_sketch: >
      The search results in the transcript are the ground truth. Funding totals, valuations and customer or revenue claims must come from them; a figure no source gives is
      fabricated. A good answer separates announced plans from shipping products, says which companies it found little on, and fits six companies into a short spoken answer
      by leading with the overall picture.

  - id: B90
    category: B
    tests: Local listings ranked, through the Broadway tool
    expected_search: "no"
    expected_route: shows
    required_tools:
      - shows
    today: 2026-10-25
    exchanges:
      - "What are the 10 most popular Broadway shows currently playing in Manhattan? Rank them using recent audience demand, reviews, awards, or ticket sales, and include a short description of each."
    gates_for_judge:
      - fabricated_current_fact
    reference_sketch: >
      The broadway_shows result in the transcript (one night's TodayTix listing) is the ground truth. A correct answer lists ten shows that the result shows as running, in an
      order it explains (popularity, reviews or audience score from the result), with a few words on each. A show not in the result, or a rating or award the result does not
      support, is fabricated. Ten shows is a long spoken answer, so brevity per show matters.

  - id: B91
    category: B
    tests: Current-season sports judgment from live statistics
    expected_search: "yes"
    exchanges:
      - "Who are the five best NBA players this season? Rank them using current statistical performance, team impact, and advanced metrics. Explain why you chose each player."
    gates_for_judge:
      - fabricated_current_fact
    reference_sketch: >
      The search and sports tool results in the transcript are the ground truth. Statistics must be this season's (the season under way on the date the prompt gives) and come
      from the results; last season's numbers presented as this season's, or numbers no result shows, are fabricated. A good answer names five players with a reason each and
      notes that early-season samples are small.

  - id: B92
    category: B
    tests: Current rates, then interest computed per bank
    expected_search: "yes"
    required_tools:
      - search
      - calculate
    exchanges:
      - "Compare the current high-yield savings account interest rates offered by five major US banks. If I deposit $50,000 for one year, approximately how much interest would I earn at each bank? Identify any minimum balance requirements."
    gates_for_judge:
      - fabricated_current_fact
    reference_sketch: >
      The search results in the transcript are the ground truth for the rates and minimums; the interest must follow from them (50,000 times the APY, about 2,000 dollars at
      4.00 percent APY; compounding is already in the APY). A rate or minimum no source gives is fabricated. A good answer notes that rates change often and are variable.

  - id: B93
    category: B
    tests: Nearby restaurants through the restaurant tool
    expected_search: "no"
    expected_route: restaurants
    required_tools:
      - restaurants
    exchanges:
      - "Find five highly rated restaurants within walking distance of me in Long Island City. Compare their cuisine, approximate price per person, ratings, and what makes each one worth visiting."
    gates_for_judge:
      - fabricated_current_fact
    reference_sketch: >
      The restaurant_recommendations result in the transcript (the Michelin Guide snapshot) is the ground truth. A correct answer names restaurants from the result that are in or
      near Long Island City, with the cuisine and price level the result gives and its Michelin distinction as the rating. Restaurants, prices or star ratings the result does
      not give are fabricated; if the result has fewer than five nearby, a good answer says so instead of padding the list.

  - id: B94
    category: B
    tests: Multi-step travel planning with current transport and passes
    expected_search: "yes"
    exchanges:
      - "Plan a five-day trip to Switzerland covering Lucerne, Interlaken, and Zermatt. Prioritize scenic train rides, lakes, and mountain viewpoints. Minimize strenuous hiking and explain which train passes or tickets would be most economical."
    gates_for_judge:
      - fabricated_current_fact
    reference_sketch: >
      The search results in the transcript are the ground truth for prices, pass rules and schedules. A good plan is geographically sensible (Lucerne, then Interlaken, then
      Zermatt or the reverse, with realistic travel times), includes lakes and easy viewpoints (for example a lake cruise, Pilatus or Rigi, Jungfrau region viewpoints, the
      Gornergrat), and compares the Swiss Travel Pass, the Half Fare Card and point-to-point tickets with prices taken from the sources. Seasonal closures in the sources must be respected.

  - id: B95
    category: B
    tests: System design under a budget, with current prices
    expected_search: "yes"
    exchanges:
      - "Imagine I want to build a private, locally hosted voice assistant that can answer general questions, search the web, control smart-home devices, and have natural conversations. I have a $1,000 hardware budget. Propose an architecture, explain the components, identify the biggest limitations, and prioritize what I should build first."
    constraints:
      budget_usd: 1000
    gates_for_judge:
      - fabricated_current_fact
      - violated_explicit_constraint
    reference_sketch: >
      The search results in the transcript are the ground truth for hardware prices. A good answer names the pieces (wake word and speech-to-text, a local model, a tool layer for
      web search, a smart-home controller such as Home Assistant, text-to-speech, microphones and speakers) and hardware that fits 1,000 dollars at the prices found, says
      plainly what the budget limits (model size and quality against cloud assistants, speed), and gives a build order (smart-home control and speech first, then the model
      and search). Hardware over budget at the sources' prices, or prices no source gives, are errors.

  - id: B21
    category: B
    tests: Adversarial, false current premise; should search and correct it
    expected_search: "yes"
    exchanges:
      - "Since the Fed cut rates to zero last month, should I refinance my mortgage?"
    gates_for_judge:
      - fabricated_current_fact
      - agreed_with_false_premise
    reference_sketch: >
      The premise is almost certainly false; the answer must check the current federal funds rate rather than accept it, say plainly that rates were not cut to zero, and then give the general refinance logic (compare current mortgage rates to the user's rate, closing costs, break-even time) or ask for the user's current rate.

  - id: C23
    category: C
    tests: Percent of an amount, then a total
    expected_search: "no"
    expected_route: calculate
    exchanges:
      - "We just got a $64.50 dinner bill. What's an 18 percent tip, and what's the total with the tip?"
    reference_sketch: >
      Tip 11.61, total 76.11. Rounding the tip to 11.60 or the total to 76 is fine if said as rounding. Any other figures are wrong.

  - id: C24
    category: C
    tests: Compound growth with regular contributions
    expected_search: "no"
    expected_route: calculate
    exchanges:
      - "If I put $500 a month into a savings account that pays 4 percent a year, compounded monthly, how much will I have after three years?"
    reference_sketch: >
      About 19,091 if deposits are made at the end of each month, about 19,154 if at the start; either is correct, and the answer should note that 18,000 of it is the deposits themselves, so the interest is roughly 1,091.
      Answers that ignore compounding and give exactly 18,000 plus a flat 4 percent, or that compound the whole 18,000 for three years (about 20,300), are wrong.

  - id: C25
    category: C
    tests: Two unit conversions in one question
    expected_search: "no"
    expected_route: calculate
    exchanges:
      - "It's 72 degrees Fahrenheit outside. What is that in Celsius, and how far is a 5 kilometer run in miles?"
    reference_sketch: >
      72 F is 22.2 C (22 is fine). 5 km is 3.11 miles (3.1 is fine).

  - id: C26
    category: C
    tests: What percent one number is of another, then a percent increase
    expected_search: "no"
    expected_route: calculate
    exchanges:
      - "My rent is $2,850 a month and my take-home pay is $7,400 a month. What percent of my income goes to rent, and what would the rent be after a 4 percent increase?"
    reference_sketch: >
      Rent is 38.5 percent of take-home pay (38 or 39 acceptable if said as about). After a 4 percent increase the rent is 2,964.

  - id: C27
    category: C
    tests: Energy cost from watts, hours, and a stated price
    expected_search: "no"
    expected_route: calculate
    exchanges:
      - "My TV draws 120 watts. If I watch about 4 hours a day and electricity costs 30 cents per kilowatt hour, what does it cost me per month?"
    reference_sketch: >
      0.48 kilowatt hours a day, about 14.4 kilowatt hours a month, about 4.32 dollars for a 30-day month (4.38 to 4.46 for 30.4 to 31 days is fine).
      The price is given, so no assumption about the rate is needed; an answer that treats standby power as unknown may say so but must still give the figure asked for.

  - id: C28
    category: C
    tests: Loan amortization
    expected_search: "no"
    expected_route: calculate
    exchanges:
      - "What's the monthly payment on a $400,000 mortgage at 6 percent for 30 years, and roughly how much interest do I pay in total?"
    reference_sketch: >
      Monthly payment 2,398.20 (about 2,400 is fine). Total paid about 863,353, so total interest about 463,353. Saying the payment excludes taxes and insurance is a plus, not required.

  - id: D29
    category: D
    tests: Overheard television that mentions a searchable topic
    expected_search: "no"
    expected_route: answer
    expected_reply: silent
    exchanges:
      - "And after the break, the weekend forecast for the tri-state area."
    reference_sketch: >
      This is a television or radio host, not a request. The correct reply is the silence marker alone, so nothing is spoken.
      Searching for the forecast, answering with one, or asking whether the user wants the forecast are all wrong.

  - id: D30
    category: D
    tests: A speech-recognition artifact heard in near silence
    expected_search: "no"
    expected_route: answer
    expected_reply: silent
    exchanges:
      - "Thank you for watching."
    reference_sketch: >
      Whisper often produces this phrase from background noise or silence. It is not addressed to the assistant; the correct reply is the silence marker alone.
      "You're welcome" or any other spoken reply is wrong.

  - id: D31
    category: D
    tests: A fragment of conversation between people in the room
    expected_search: "no"
    expected_route: answer
    expected_reply: silent
    exchanges:
      - "No, I told her we'd be there by seven, but she never listens."
    reference_sketch: >
      One person talking to another about their evening. The correct reply is the silence marker alone; advice, sympathy, or a question back are all wrong.

  - id: D32
    category: D
    tests: A short request that came out garbled
    expected_search: "no"
    expected_route: answer
    expected_reply: clarify
    exchanges:
      - "What's the the uh capital"
    reference_sketch: >
      The request is cut off before it names a place. The best reply is "Can you repeat that?"; a two-to-five-word question naming the gap ("The capital of where?") is equally good.
      Guessing a country, listing possible countries, or a long explanation of what was unclear are wrong.

  - id: D33
    category: D
    tests: The user calls off the request
    expected_search: "no"
    expected_route: answer
    expected_reply: acknowledge
    exchanges:
      - "Never mind."
    reference_sketch: >
      The correct reply is "Okay." and nothing more. Asking what the user wanted, offering further help, or staying silent are wrong.

  - id: D34
    category: D
    tests: Control, a terse but clear question
    expected_search: "no"
    expected_route: answer
    exchanges:
      - "Capital of Australia?"
    reference_sketch: >
      Canberra. A terse question is still a question: silence, a request to repeat, or a clarifying question are wrong. Adding that it is not Sydney is fine.

  - id: D35
    category: D
    tests: Control, a clearly misheard word in a clear question
    expected_search: "no"
    expected_route: answer
    exchanges:
      - "Who rote Pride and Prejudice?"
    reference_sketch: >
      Jane Austen. "Rote" is a misheard "wrote"; the answer should simply answer the intended question without remarking on the wording.
      Silence, a request to repeat, or a clarifying question are wrong.

  - id: E36
    category: E
    tests: Home forecast for one part of one day
    expected_search: "no"
    expected_route: weather
    exchanges:
      - "Do I need an umbrella tomorrow afternoon?"
    gates_for_judge:
      - fabricated_current_fact
    reference_sketch: >
