# TriviaBench: 1,000 questions from the TriviaQA validation split (rc.nocontext, https://huggingface.co/datasets/mandarjoshi/trivia_qa, Apache 2.0),
# chosen for spread rather than at random. in_xs marks TriviaBench XS, the first 100 picks, so XS is a subset of S with the same balance.
#
# How the set was built (2026-10-10):
# - Pool: the 9,960 unique validation questions, less 78 whose key Claude Opus 5.5 judged outdated or wrong, less 320 labelled time_sensitive
#   (an answer that may have changed since the 2017 key, such as a current office holder or a record), because a model that searches finds
#   today's answer and would be marked wrong for it. 9,562 remained.
# - Labels: topic and year of relevance were written by Claude Opus 5.5 while answering; difficulty (1 easy, 2 medium, 3 hard: how obscure the fact
#   is for a well-read adult) and time_sensitive by ten Claude Opus 5.5 subagents. Difficulty is a model's judgement, not a measured pass rate.
# - Selection: greedy and seeded. Each pick takes a question from the (topic, era, difficulty) cell furthest behind its targets: topics equal
#   (Math capped at what the pool has), 20% timeless and the rest spread evenly over seven eras, and difficulty 30% easy, 40% medium, 30% hard.
# Version 1.1 removes eight questions from 1.0 (two that point at options TriviaQA dropped, two with a broken or open-ended key, four repeats)
# and backfills by the same rule from the counts of the 992 kept, under new ids TB1001 on, so results on kept ids stay comparable.
# question: TriviaQA's text, with the CSV escaping some questions carry undone (outer quotes dropped, doubled quotes single).
# answers: the TriviaQA value first, then its aliases. year: negative for BC, null when no year applies.
