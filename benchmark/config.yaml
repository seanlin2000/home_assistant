# Benchmark configuration. Every candidate runs with the same policy; see design_docs/v1/01_llm_benchmark.md section 6 for the fairness rules.
policy:
  temperature: 0.7
  max_tool_rounds: 4
  max_output_tokens: 600
  word_budget: 200
  context_tokens: 16384
  tool_timeout_seconds: 60

services:
  ollama_host: http://127.0.0.1:11434
  searxng_url: http://127.0.0.1:8080
  mcp_host: 127.0.0.1
  mcp_port: 8766  # the product's MCP service owns 8765; the benchmark runs its own server with a per-run cache on a separate port
  results_dir: benchmark/results
  # The home weather_forecast reports on in the benchmark: a public landmark (the Empire State Building, also scripts/ha_setup.py's default) in the
  # user's time zone and units, fixed here so results never depend on .env. The per-run cache pins the first forecast fetched for the whole run.
  weather_home:
    latitude: 40.7484
    longitude: -73.9857
    timezone: America/New_York
    units: imperial

# preview: a reduced-precision build of a model whose production version does not fit the prototype machine.
candidates:
  - key: qwen3.5-4b
    label: Qwen 3.5 4B, Q4_K_M
    provider: ollama
    model: qwen3.5:4b
    think: false
  - key: gemma4-e4b
    label: Gemma 4 E4B, QAT int4
    provider: ollama
    model: gemma4:e4b-it-qat
    think: false
  # llama-server: the model is the table key in config/serving.toml; start the server with `uv run serving launch` before the run.
  - key: gemma4-e4b-llama
    label: Gemma 4 E4B, QAT q4_0, on llama-server (prompt 2.0)
    provider: llama-server
    model: gemma-4-e4b
    think: false
  - key: qwen3.5-9b
    label: Qwen 3.5 9B, Q4_K_M
    provider: ollama
    model: qwen3.5:9b
    think: false
  - key: gemma4-12b
    label: Gemma 4 12B, Q4_K_M
    provider: ollama
    model: gemma4:12b
    think: false
  - key: gpt-oss-20b
    label: gpt-oss 20B, MXFP4
    provider: ollama
    model: gpt-oss:20b
    think: low
  - key: gemma4-26b-a4b-iq3
    label: Gemma 4 26B-A4B, UD-IQ3_XXS (3-bit preview)
    provider: ollama
    model: hf.co/unsloth/gemma-4-26B-A4B-it-GGUF:UD-IQ3_XXS
    think: false
    preview: true
  - key: gemma4-26b-a4b-iq4
    label: Gemma 4 26B-A4B, UD-IQ4_XS (preview, tight fit)
    provider: ollama
    model: hf.co/unsloth/gemma-4-26B-A4B-it-GGUF:UD-IQ4_XS
    think: false
    preview: true
  - key: qwen3.6-35b-a3b-iq3
    label: Qwen 3.6 35B-A3B, UD-IQ3_XXS (3-bit preview)
    provider: ollama
    model: hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ3_XXS
    think: false
    preview: true
  - key: qwen3.6-27b-q3ks
    label: Qwen 3.6 27B dense, Q3_K_S (3-bit preview, spills to CPU on 16 GB)
    provider: ollama
    model: hf.co/unsloth/Qwen3.6-27B-GGUF:Q3_K_S
    think: false
    preview: true
  # manual: answers written by hand and replayed through the same loop and tools (benchmark-manual). A reference point, not a purchasable candidate.
  # The first hand-written pass (claude-fable-5-1-manual) was superseded by the closed-book pass on 2026-09-07; its files stay in results/version_5 but it is no longer a configured candidate, so reports omit it.
  - key: claude-fable-5-1-manual-2
    label: Claude Fable 5.1, closed-book hand-written pass by a fresh subagent (reference ceiling)
    provider: manual
    model: claude-fable-5-1 (manual, pass 2)

judge:
  review_sample_fraction: 0.2
  review_seed: 20260905
