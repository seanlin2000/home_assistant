          The core is the microphone: for a room that size you want a far-field microphone array, several capsules with beamforming and acoustic
          echo cancellation, so it can pick your voice out across the room and still hear you while it is playing sound itself; that matters
          more than anything else you buy. Place it centrally on an open surface, away from walls, the fridge, and the air conditioner, roughly
