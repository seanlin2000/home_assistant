  - question_id: B14
    turns:
      - queries:
          - "why NVIDIA GPU prices rising 2026 supply"
        answer: >-
          The short version is that it is a memory shortage, not a chip shortage. The AI data center build-out is consuming high-bandwidth and
          high-density memory faster than Samsung, SK Hynix, and Micron can make it, and because those parts share wafer capacity with the
          graphics memory on consumer cards and carry higher margins, the memory makers serve the data centers first; one estimate has AI data
          centers absorbing around seventy percent of world memory output this year. Graphics memory prices reportedly rose several hundred
          percent, with sixteen gigabytes of GDDR seven going from under eighty dollars in mid last year to over two hundred, so memory is now
          the majority of a card's bill of materials and board partners cannot absorb it. Nvidia and AMD both told partners of double-digit
          increases in August, and retail trackers show RTX fifty series cards up as much as thirty-nine percent since June, with the mid-range
          sixteen gigabyte cards hit hardest because they carry the most memory for their price. The sources agree this is structural, with
          forecasts of further memory price rises through next year.
