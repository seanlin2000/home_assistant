          yellow bottom leaves on a healthy, actively growing plant is usually fine. The main problem to rule out is nitrogen deficiency, since
          nitrogen moves from old leaves to new ones, so the bottom yellows first and evenly; the others are overwatering or poor drainage
          stressing the roots, or the lower leaves being shaded out and dropped. Before deciding, I would want to know what kind of plant it is,
