  - question_id: A8
    turns:
      - answer: >-
          I would recommend the router design for a personal assistant. Most of what you say to it all day is simple, timers, lights, music,
          quick facts, and for those a deterministic path is faster, cheaper, and predictable, while a small model or intent classifier decides
          which requests actually need the big model. The single large model is simpler to build and more flexible, but you pay its latency and
          cost on every request and get occasional surprising behavior on exactly the commands that should never surprise you. The router's costs
          are misrouting, which you limit by sending anything uncertain to the big model, and more moving parts to maintain. If your usage is
          mostly open-ended conversation rather than commands, or you are still prototyping, the single model is fine to start and you can add
          routing later.
