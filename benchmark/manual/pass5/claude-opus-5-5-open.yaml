          Because the stock market tracks the expected profits of big companies, not the living standards of typical households, and the two can drift far apart.
          First, ownership is concentrated. In the US the wealthiest tenth of households own the large majority of stocks, so a rally mostly raises wealth that most people don't hold, while what they actually feel is their paycheck, rent and groceries.
          Second, profits can rise at workers' expense. If companies hold wages down, raise prices faster than their costs, or replace staff with automation, margins and share prices climb even as real wages fall. During inflation, shoppers pay more while firms pass costs along and protect earnings.
          Third, the index isn't the local economy. A handful of giant tech firms can drive the whole market, and many earn much of their money overseas, so a boom in a few companies selling chips or software worldwide says little about local jobs, housing costs or small businesses.
          Add easy money that inflates asset prices, and you can get a soaring market alongside stretched household budgets.
