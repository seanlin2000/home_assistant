      - answer: >-
          A stock is worth, in theory, all the cash the company will ever produce, with each future dollar discounted back to today.
          That discount rate starts from the risk-free interest rate, roughly what Treasuries pay, plus a premium for risk.
          When the Fed raises rates, the discount rate rises, so every future dollar is worth less today. And because the discount compounds year after year, the further away a dollar is, the bigger the hit.
          Growth tech companies are long-duration assets, a lot like long-term bonds: most of their expected profits sit many years out, while a utility or a bank earns more of its value sooner. So the same rate rise cuts a growth stock's present value by a much larger share.
          Higher rates also pile on in other ways. Safe bonds become a more attractive alternative, borrowing gets costlier for unprofitable firms that need fresh funding, and a slower economy can trim the growth investors were counting on.
          That's why high-valuation tech stocks tend to fall hardest when rates climb, as they did in twenty twenty-two.
