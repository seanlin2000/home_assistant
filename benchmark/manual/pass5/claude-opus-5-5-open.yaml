          Your model, your full prompts and your conversation history stay on your computer. What leaves is whatever your software sends to the search provider.
          That's the search query itself, which the model writes and can echo personal details from your question; your IP address, which reveals rough location and your internet provider; your API key, which ties every query to your account and payment details; and timestamps and usage patterns.
          If your tool also fetches the result pages, each of those websites sees your IP address and which page you opened.
          To minimize exposure, first control what goes out: have your software keep queries to short keywords and strip names, addresses and other personal details.
          Second, only search when needed, so everyday questions never leave home.
          Third, choose a provider with a clear no-logging or short-retention policy, or self-host a metasearch engine like SearXNG, though it still forwards queries to the engines behind it.
          Fourth, use a VPN or Tor to hide your IP address, though the API key still identifies you.
  - question_id: A82
    exchanges:
      - answer: >-
          An API is the interface a service exposes for programs, like a search provider's web endpoint that returns results as data; it isn't designed for language models at all.
          A tool is a capability a model can call, described by a name, a purpose and its arguments, such as search the web with a query.
          An MCP server, from the Model Context Protocol, is a standard way to publish a set of tools to any compatible AI app, so the same tools plug into different clients without custom glue.
          So the API is the raw service, the tool is the model-facing capability, and MCP is the standard plug that delivers tools.
          For your system, serve the local model with something like llama.cpp, and put a small harness in front of it that runs the tool-calling loop.
          Then write one MCP server with a search tool that calls a search API or a self-hosted SearXNG, and a fetch tool that downloads a page and extracts its main text, trimmed to fit the context window.
          Let the model summarize from that text, treating it as untrusted.
