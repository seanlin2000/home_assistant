          These are probably two separate problems.
          Choppy audio usually comes from Bluetooth itself. Common causes are interference, since Bluetooth shares the crowded two point four gigahertz band with Wi-Fi, which a streaming laptop is busy using; the speaker juggling two devices when the laptop also connects to it; distance or obstacles; or a weak Bluetooth radio in the projector.
          Troubleshoot one change at a time: unpair the speaker from the laptop, move it closer with a clear line of sight, put your Wi-Fi on five gigahertz, and test with the laptop off. If it's still choppy, use a wired audio cable, which also removes the Bluetooth delay that hurts gaming.
          For eye strain, likely causes are an image too dim for a bright room or too bright in a dark one, sitting so close the picture fills your vision, motion blur or lag from picture processing, soft focus or heavy keystone correction, and the rainbow effect on single-chip DLP projectors.
          Try game mode, refocus, position the projector instead of using keystone, add soft room light, and sit farther back.
