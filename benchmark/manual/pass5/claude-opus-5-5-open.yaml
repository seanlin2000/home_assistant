      - answer: >-
          Sunlight looks white, but it's really a mix of every color, and each color travels as a wave of a different size: blue waves are short and choppy, red waves are long and lazy.
          When sunlight passes through the air, the tiny gas molecules bounce the short blue waves around far more than the long red ones, so blue light gets scattered all across the sky.
          Wherever you look during the day, scattered blue light is coming at you from that direction, so the whole sky looks blue.
          Violet scatters even more, but sunlight has less of it and our eyes are less sensitive to it, so we see blue.
          At sunset the sun is low, so its light has to travel sideways through much more air to reach you.
          Along that long path, most of the blue gets scattered off in other directions before it arrives, leaving the oranges and reds to come straight through.
          Dust, smoke or haze adds extra scattering, which is why sunsets can look especially fiery on hazy evenings or after wildfires.
          Scientists call this Rayleigh scattering.
