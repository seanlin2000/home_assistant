      - answer: >-
          GPUs are good at inference because running a neural network is mostly huge matrix multiplications, and a GPU has thousands of small cores that do them in parallel, very fast memory to feed them, and a mature software stack, CUDA, that every framework already targets.
          The difference between the chip types is flexibility versus specialization. A GPU can train and serve any model, which is why NVIDIA dominates.
          An ASIC is a chip built for one job; Google's TPU is the classic example.
          Specialized inference processors, like Groq's chips, Cerebras's wafer-scale engine, or transformer-only designs, go further, often keeping weights in on-chip memory or hard-wiring the transformer pattern, because generating text is usually limited by how fast weights move from memory, not by raw math.
          A specialized chip can beat an NVIDIA GPU when the workload is huge and stable, like serving one popular model at scale, when per-user latency matters most, or when power and cost per token dominate.
          It loses when models change quickly or you need training, because the GPU's software ecosystem and versatility win.
  - question_id: A80
    exchanges:
      - answer: >-
          Quantizing means storing each of the model's weights with fewer bits. Weights normally use sixteen bits each; quantization rounds them onto a small grid of values, sixteen levels at four bits and just four levels at two bits, with a shared scale factor for each small block so the rounding stays close.
          For a seventy-billion-parameter model, sixteen-bit weights take about a hundred forty gigabytes. At four bits it's half a byte per weight, roughly thirty-five gigabytes, and at two bits about seventeen and a half.
          Real files run a bit larger because of those scale factors and a few layers kept at higher precision, and you still need extra memory for the conversation context.
          The gains: the model fits on a single GPU or a Mac, and it generates faster, since speed is mostly limited by memory bandwidth.
          The cost is accuracy. Four-bit is usually close to the original, with small losses in reasoning and precise facts. Two-bit degrades noticeably, with more mistakes, weaker instruction following and sometimes gibberish, so a smaller model at four bits often beats a bigger one at two.
