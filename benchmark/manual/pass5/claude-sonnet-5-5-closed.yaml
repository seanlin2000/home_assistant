          There are probably two unrelated problems. For the choppy audio, the usual cause is Bluetooth interference or bandwidth. Bluetooth shares the crowded two point four gigahertz band with Wi-Fi, microwaves and other devices, and a laptop with a busy Wi-Fi connection can interfere with itself. Other causes are distance or obstacles, a weak laptop Bluetooth adapter, the speaker connected to two devices at once, or a codec fallback. To troubleshoot, change one thing at a time. Move the laptop and speaker closer, disconnect the speaker from the projector and test with only the laptop, switch your laptop Wi-Fi to the five gigahertz band, update Bluetooth drivers, remove and re-pair the speaker, and test another audio source. If it is only choppy with the laptop, the laptop is the culprit. For eye strain, projectors are viewed in dim rooms with a bright image, which makes the eyes work harder. Games also have fast motion, lower contrast sharpness, input lag, and flicker from some projector types. Check brightness, room lighting, focus, resolution and refresh rate, and take breaks. A bias light behind the screen can help.
