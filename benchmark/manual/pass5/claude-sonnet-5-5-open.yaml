          The Cold War ended because the Soviet Union itself came apart, not because of a battle. I would point to three events. First, Gorbachev's reforms in the late nineteen eighties, glasnost and perestroika, loosened censorship and the economy, which let long-suppressed grievances surface. Second, the revolutions of 1989 in Eastern Europe, including the fall of the Berlin Wall, when Moscow chose not to send tanks, which broke the Soviet hold on its satellites. Third, the failed hard-line coup in August 1991, which discredited the Communist Party and handed power to Boris Yeltsin and the republics. The Soviet Union was formally dissolved in December 1991. Now the distinction. The deeper causes were slow-moving: a stagnant, over-militarized command economy, the cost of the arms race and the Afghan war, falling oil revenue, and rising nationalism in the republics. The immediate triggers were the loss of the satellites, the coup attempt, and the independence declarations that followed, especially Ukraine's referendum, which made a union without Ukraine unworkable.
