          For the choppy audio, the likeliest cause is Bluetooth interference or bandwidth. Your laptop's Bluetooth and Wi-Fi both use the crowded 2.4 gigahertz band, and the projector may be broadcasting too, so a second connection can drop packets. Distance, walls and a weak laptop Bluetooth chip can also matter. To troubleshoot, test one change at a time. Connect the speaker to the laptop alone, then add the projector. Move the devices closer, switch the laptop's Wi-Fi to the 5 gigahertz band, and update drivers. If a wired option exists, try a cable or a Bluetooth adapter. For eye strain, compare to your monitor on these points. A projector is usually dimmer in contrast, may be too bright in a dark room, or too dim in a lit room. Resolution, focus, a low refresh rate, input lag settings and flicker can also tire the eyes. Check the focus, brightness and gamma settings, turn on the game mode, match the room lighting, sit farther back, and take breaks. Change one setting at a time and see what helps.
