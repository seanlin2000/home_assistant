          An API is a general way for one program to talk to another over a defined interface, like a weather service you call over the web. A tool is something a language model can invoke, a function with a name, a description and arguments, such as search the web. An MCP server is a standardized package that exposes tools, and other resources, to any model-facing app using the Model Context Protocol, so you write the tool once and any compatible client can use it. To give a local model web search, page retrieval and summaries, I would run an MCP server with three tools. One searches, using a search API or a self-hosted engine like SearXNG. One fetches a page and extracts its main readable text. Summarizing is best left to the model itself, which reads the returned text. The local app sits in the middle, runs the model, passes it the tool definitions, executes the calls it requests, and feeds the results back. Add limits on page length, treat fetched text as untrusted, and cap the number of tool calls per question.
