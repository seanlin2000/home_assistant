          Those are probably two separate issues. For choppy audio, the usual causes are Bluetooth interference and bandwidth. Bluetooth shares the crowded two point four gigahertz band with Wi-Fi, so a router, a laptop radio or other devices can interrupt it. The laptop may also be using a weaker codec, or sending video and audio across a busy Wi-Fi link at once. Distance or obstructions between the speaker and the laptop, and a low battery on the speaker, also matter. Troubleshoot by changing one thing at a time: move the speaker closer with a clear line of sight, switch the router to the five gigahertz band or move it away, disconnect other Bluetooth devices, update the laptop's Bluetooth and audio drivers, and test with another source such as your phone. For eye strain, a projector image is typically dimmer and lower contrast than a monitor, and playing in a dark room makes the screen far brighter than its surroundings. Input lag, low refresh rate, blur, and fixed focus issues also tire the eyes. Try some room lighting, check focus and brightness settings, enable a game mode, and take breaks.
