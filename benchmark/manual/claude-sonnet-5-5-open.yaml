          An API is a defined way for one program to ask another to do something, like a web service that returns search results. A software tool, in the language-model sense, is a function the model can call, with a name, a description and arguments. An MCP server is a standard wrapper, using the Model Context Protocol, that exposes tools to any compatible model application in a uniform way, so you do not write custom glue for each one. Often a tool calls an API underneath, and an MCP server is how you package tools. For a local model that searches, reads and summarizes, I would run three layers. The model runs on a local inference server. An orchestrator, the program that talks to the model, connects to one MCP server that offers a search tool, which calls a search API or a self-hosted engine, and a page-fetch tool that downloads a page and extracts its main text. The model decides when to call them. Keep results short, cap how much page text is returned, and mark web text as untrusted so instructions inside pages are ignored. Then the model summarizes the retrieved text itself.
