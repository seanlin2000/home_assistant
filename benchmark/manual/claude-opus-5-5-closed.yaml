  - question_id: B95
    exchanges:
      - answer: >-
          Here's a solid plan for about a thousand dollars.
          The core is one always-on computer: a mini PC or used desktop with a GPU of around sixteen gigabytes of video memory, or an Apple Silicon Mac mini with as much memory as you can afford.
          On it, run Home Assistant for smart-home control, Whisper for speech-to-text, a local language model of roughly seven to fourteen billion parameters through llama.cpp or Ollama, and Piper for a natural voice.
          Connect them through Home Assistant's Wyoming protocol, and give the model web search, page fetching and device control as tools through an MCP server.
          Then add a few cheap satellite microphones with wake-word detection.
          The biggest limitations are that a small local model reasons and recalls facts worse than cloud models, delay adds up across listening, thinking and speaking, cheap microphones struggle across a room, and web search still exposes your queries to the provider.
          Build in this order: Home Assistant with device control first, then local voice in one room, then the language model, then web search, and finally more satellites and polish.
