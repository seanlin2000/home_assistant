  - question_id: B89
    exchanges:
      - calls:
          - {name: search_and_read, arguments: {query: "AI inference chip startups funding valuation 2026", time_range: month}}
          - {name: search_and_read, arguments: {query: "Etched MatX Positron funding round valuation", time_range: year}}
          - {name: search_and_read, arguments: {query: "Cerebras SambaNova Fractile funding news", time_range: year}}
        answer: >-
          I couldn't verify the latest funding rounds or valuations, so I'll compare technology and rough standing from what I knew, and you should treat any money figures as dated.
          The field is hot, with investors betting inference will outgrow training.
          Cerebras is the most mature: it builds one giant chip the size of a whole wafer, runs a fast inference cloud, and has raised well over a billion dollars, with an on-and-off plan to go public.
          SambaNova uses reconfigurable dataflow chips with lots of memory and has also raised over a billion, but has struggled and was reported to be exploring a sale.
          Etched makes Sohu, a chip hard-wired for transformer models, betting that architecture stays dominant.
          MatX, founded by former Google TPU engineers, designs chips for very large models.
          Positron builds power-efficient inference servers focused on memory bandwidth.
          Fractile, in London, is earliest stage, computing inside memory to speed up token generation.
          Commercially, Cerebras clearly leads; the others are mostly before volume production.
