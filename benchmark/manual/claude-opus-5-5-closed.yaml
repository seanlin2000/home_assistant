        answer: >-
          First, I'd question the premise: I couldn't confirm that the Fed cut rates to zero last month, and as far as I know its rate was well above zero, so please double-check that.
          Either way, the Fed doesn't set mortgage rates directly; thirty-year mortgages follow the ten-year Treasury yield plus lender spreads, so a Fed cut doesn't automatically mean cheap mortgages.
          Whether refinancing makes sense depends on your numbers.
          A common rule of thumb is that it's worth a look if you can lower your rate by about three quarters of a point or more and you'll stay in the home long enough for the monthly savings to repay the closing costs, which typically run two to five percent of the loan.
          Also weigh whether restarting a thirty-year term raises your total interest.
          What's your current rate, balance, and how long you plan to stay?
          With those and a quoted new rate, I can work out your break-even.
