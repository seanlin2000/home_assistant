  - question_id: A84
    exchanges:
      - answer: >-
          When the Fed raises rates, the safe return investors can earn goes up, and that lowers what every future dollar is worth today.
          A stock's value is the sum of the cash it will generate in future years, each year's cash discounted back to the present.
          That discount rate is built on interest rates: if you can earn five percent risk-free instead of one, a dollar promised years from now is worth less, and the further out the cash, the more the discount compounds.
          That's why growth tech stocks get hit hardest.
          Much of their value comes from profits expected ten or twenty years away, so they behave like long-duration bonds, very sensitive to rates.
          A mature company earning big profits now has most of its value in the near term, so higher rates dent it less.
          Higher rates also make borrowing and raising money costlier for unprofitable growth firms, and make bonds a more attractive alternative.
