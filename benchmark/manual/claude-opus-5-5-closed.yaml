  - question_id: A77
    exchanges:
      - answer: >-
          Sunlight is a mix of every color, and each color is a wave: blue waves are short, red waves are long.
          As sunlight crosses the air, it hits tiny gas molecules, much smaller than the waves.
          Those molecules are far better at bouncing short blue waves around than long red ones, so blue gets scattered all across the sky.
          Wherever you look in daytime, blue light is coming at you from every direction, so the sky looks blue.
          Violet scatters even more, but sunlight has less of it and our eyes are less sensitive to it, so we see blue rather than purple.
          At sunset, the sun is low, so its light travels sideways through many times more air to reach you.
          Along that long path, most of the blue gets scattered away before it arrives, leaving the oranges and reds.
          Picture a long hallway where people grab the blue balloons as you pass: by the end, only the red ones are left.
