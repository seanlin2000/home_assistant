          Because the stock market and everyday life measure different things for different people.
          The market prices big companies' future profits, and stock ownership is concentrated, with the wealthiest tenth of households owning most shares, so gains mostly go to people who already have assets.
          Most people feel the economy through wages, rent, groceries and job security instead.
          Here are three concrete ways this happens.
          First, companies cut costs with layoffs, automation or small raises; margins rise and the stock climbs, while workers lose income or bargaining power.
          Second, the biggest listed companies earn much of their money worldwide, so a handful of tech giants can lift the index on overseas sales or an AI boom even while local hiring is weak.
          Third, inflation and cheap money push up the prices of assets like stocks and homes, which helps owners, while renters and younger people face rent, food and borrowing costs that outpace their raises.
          Stock buybacks add to it, lifting share prices without creating any jobs.
  - question_id: A79
    exchanges:
      - answer: >-
          GPUs excel because AI inference is mostly huge matrix multiplications, simple math repeated billions of times, and a GPU has thousands of small cores doing it in parallel, fed by very fast high-bandwidth memory.
          NVIDIA adds tensor cores and CUDA, the software nearly every AI framework is built on.
          But a GPU is still general purpose.
          An ASIC is a chip built for one job, like Google's TPU, which drops flexibility to spend its silicon on matrix math.
          Specialized inference processors are ASICs aimed at serving models: some pack huge amounts of fast memory onto the chip, like Groq or Cerebras, while others hard-wire one architecture such as transformers.
          A specialized chip can beat an NVIDIA GPU when the model architecture is stable, when the bottleneck is memory bandwidth for generating tokens one at a time, when lowest latency or energy per token matters most, and when the operator controls the whole software stack.
          It loses when models change quickly, when you also need training, or when broad software support matters more than raw efficiency.
  - question_id: A80
    exchanges:
      - answer: >-
          Quantizing means storing each of the model's seventy billion weights with fewer bits.
          Normally each is a sixteen-bit number, about a hundred and forty gigabytes in total.
          At four bits, each weight is half a byte, so the weights need roughly thirty-five gigabytes; real formats also store small scaling factors per block, so expect closer to forty.
          At two bits it's about seventeen and a half gigabytes in theory, realistically around twenty.
          Running it also needs extra memory for the context cache.
          The trade-off is precision: four bits allows only sixteen possible values per weight, and two bits just four.
          Good four-bit methods lose surprisingly little, usually a small benchmark drop most people barely notice.
          Two-bit is much rougher: reasoning, math, instruction following and well-formed output get noticeably worse, and a smaller model at higher precision often beats it.
          The upside is that quantized models fit on consumer hardware and usually run faster, because generating text is limited by how fast memory can be read.
  - question_id: A81
    exchanges:
      - answer: >-
          The search provider sees what's in each request you send, and nothing else.
          What stays local is the model, your full conversation, your prompts and documents, and the model's reasoning.
          What gets transmitted is the query text the model writes, your public IP address, which reveals rough location and internet provider, the time of each request, and your API key, which ties every query to your account and billing details.
          Over time, those queries can paint a detailed picture of your interests.
          And if your system then fetches result pages, each of those websites sees your IP address too.
          To minimize exposure, have the model write short, generic queries and never put personal details or the whole conversation into them; pick a provider with a clear no-logging or short-retention policy; route requests through a VPN or proxy to hide your address, or self-host a metasearch tool like SearXNG, which needs no account; and fetch pages through the same proxy.
  - question_id: A82
    exchanges:
      - answer: >-
          An API is a contract that lets one program call another, like a search company's interface that takes a query and returns results.
          A tool, in the AI sense, is a single function the model may call, with a name, a description and typed arguments.
          An MCP server packages a set of tools behind the standard Model Context Protocol, so any compatible AI app can discover and call them without custom glue; its tools often call APIs underneath.
          For your system, run the model locally with llama.cpp or Ollama, plus a small orchestrator that sends the conversation to the model, notices when it requests a tool, runs it, and feeds the result back.
          Then build one MCP server with two tools: a search tool that calls a search API and returns titles, links and snippets, and a fetch tool that downloads a page and extracts its main text, trimmed to fit the context window.
          Summarizing needs no tool; the model does that itself.
          Add timeouts and length limits, and treat web text as untrusted.
