          I'd build it on Home Assistant, which already handles smart-home control and has a local voice pipeline. The pieces are small microphone satellites, like Home Assistant's own Voice Preview Edition, listening for a wake word; Whisper for speech-to-text; a local language model served by llama.cpp or Ollama; Piper for text-to-speech; and a small MCP tool server that gives the model web search through an API like Brave or a self-hosted SearXNG. For the main box, I couldn't check today's prices, but the choice is a Mac mini with as much memory as the budget allows, or a used PC with a sixteen-gigabyte graphics card, keeping about a hundred dollars for satellites. The biggest limitations: at this budget you'll run models of roughly eight to thirty billion parameters, which know less and call tools less reliably than cloud models; long conversations get slow; and wake words misfire on the TV. Build in this order: voice control of your devices first, since it's the most useful; then conversation; then web search; then speed and polish.
