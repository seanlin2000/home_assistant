          An API is the general idea: a defined way for one program to ask another to do something, usually over the web. A tool is a specific capability you hand to a language model, like search the web or read a page, which the model can choose to call. An MCP server is a standard way to package tools, so any compatible app can discover and call them the same way, instead of writing custom glue for each one. So an API is the underlying service, a tool is what the model sees, and an MCP server is a standardized wrapper that offers tools. For your local model, I would build three layers. First, an MCP server that exposes a search tool, a page-fetch tool and ideally a combined search and read tool that returns trimmed text. Second, your local model running in a chat program that supports tool calling, which decides when to search and then reads the results. Third, safeguards. Treat web text as untrusted, limit how many calls it can make, and trim pages to a manageable length. The model then writes the summary itself from the returned text.
