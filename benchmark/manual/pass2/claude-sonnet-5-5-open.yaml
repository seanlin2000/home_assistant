          The choppy audio is most likely a Bluetooth issue, and the eye strain is most likely a display issue, so I would troubleshoot them separately. For the audio, Bluetooth shares the crowded two point four gigahertz band with Wi-Fi, microwaves and other devices, so interference is a prime suspect, especially if your laptop is on two point four gigahertz Wi-Fi. Other causes are distance or obstacles, the laptop sending a high-bitrate codec the speaker handles poorly, a weak adapter or old driver, or the speaker being connected to two sources at once. To test, move the speaker closer, switch the laptop to five gigahertz Wi-Fi or Ethernet, disconnect other Bluetooth devices, update drivers, and compare with the speaker on a phone. For the eye strain, projectors can cause more strain from high brightness against a dark room, lower sharpness, motion blur or input lag, flicker, and a long viewing distance. Test by dimming the projector, adding some soft room lighting, lowering contrast, turning on game mode, checking resolution and refresh rate, and taking regular breaks.
