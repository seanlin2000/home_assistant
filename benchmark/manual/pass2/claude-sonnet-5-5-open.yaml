          The premise is not right. The Fed has not cut rates to zero. At its October twenty-eighth meeting it held its target range at three point seven five to four percent, after raising rates a quarter point in September, and two members wanted a further hike. Mortgage rates have gone up this year, not down. Freddie Mac's thirty-year average was seven point three two percent on October twenty-second, compared with five point nine eight percent in late February. So whether you should refinance depends on your current rate. If you locked in at around three to five percent, refinancing now would almost certainly cost you more. If you have a rate well above seven and a half percent, or an adjustable loan about to reset, it could be worth pricing. A refinance pays off only if your monthly savings cover the closing costs within the time you will stay in the home. What is your current mortgage rate, and how long do you expect to stay?
