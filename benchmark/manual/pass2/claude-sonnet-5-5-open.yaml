          The Cold War ended because the Soviet system ran out of money, legitimacy and options, and then a few events turned that slow decay into a collapse. Let me separate the two. The deep causes were a stagnant command economy that could not afford an arms race with the United States, the drain of the war in Afghanistan, and a population that increasingly did not believe the official story. The first key event was Gorbachev's reforms, glasnost and perestroika, which opened debate but also let long-suppressed anger and nationalism come out. The second was 1989, when Moscow declined to use force and communist governments across Eastern Europe fell, including the Berlin Wall, which broke the Soviet hold on its satellites. The third was the failed hardline coup of August 1991, which discredited the Communist Party and handed power to Boris Yeltsin and the republics. Those last two are the immediate triggers. The coup especially led straight to republics declaring independence, and in December 1991 Russia, Ukraine and Belarus agreed to dissolve the union. So the causes were structural, and the triggers were the loss of control over Eastern Europe and the botched coup.
