      - answer: >-
          An API is a contract that lets one program call another, like a search company's endpoint that returns results as data. A tool is something a language model is allowed to call: a named function with described arguments, like
          search with a query, that your code runs on the model's behalf. An MCP server is a standard way to package tools, so any MCP-aware assistant can discover and call them without custom wiring; it often wraps APIs inside. For your
          system, I'd use four layers. First, a local model server such as llama.cpp or Ollama, running a model that handles tool calling well. Second, an agent loop that sends the conversation and tool descriptions to the model, runs
          each tool call, and feeds results back. Third, an MCP server exposing a web search tool, backed by a search API or self-hosted SearXNG, and a page fetcher that extracts readable text. Fourth, summarizing is the model itself reading
          those trimmed results. Keep page text short, mark web text as untrusted, and cache results.
