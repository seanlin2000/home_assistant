          The Cold War ended when the Soviet bloc collapsed from within between 1989 and 1991. The deep causes came first: a stagnant planned economy that could not keep up with the West, the drain of the arms race and the war in Afghanistan,
          and Gorbachev's reforms, glasnost and perestroika, which loosened censorship and central control without fixing the economy, letting nationalist movements in the republics grow. The three key events were these. First, the revolutions of
          1989 in Eastern Europe, symbolized by the fall of the Berlin Wall, when Moscow chose not to send tanks and its satellite states slipped away. Second, the failed hardline coup of August 1991, which shattered the Communist Party's authority
          and made Boris Yeltsin, not Gorbachev, the dominant figure. Third, the December 1991 Belovezha Accords, where the leaders of Russia, Ukraine and Belarus declared the Soviet Union dissolved, right after Ukraine voted for independence.
          So the causes were economic decay, reform and nationalism; the immediate triggers were the coup and the Belovezha agreement, and Gorbachev resigned on December twenty-fifth, 1991.
