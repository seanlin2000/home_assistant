          It comes down to how sunlight bounces off the air itself. Sunlight looks white, but it's really a mix of all colors, and each color travels as a wave of a different size. Blue light has short, choppy waves, and red light has long,
          lazy ones. The tiny gas molecules in the air are much better at knocking the short blue waves off course than the long red ones, so blue light gets scattered all over the sky. Wherever you look, some of that bounced blue light is
          heading toward your eyes, so the whole sky glows blue. At sunset, the sun is low, and its light has to travel through far more air to reach you, skimming along the atmosphere instead of coming straight down. By the time it arrives,
          most of the blue has been scattered away along the route, and what's left is the long-wave light: the oranges and reds. Dust, smoke and moisture in the air can make those sunsets even more vivid.
