          Because the stock market measures expected profits of large companies, while people feel the economy through wages, prices and job security, and those can move in opposite directions. Stock ownership is also concentrated: the
          wealthiest households own most shares, so rising prices mostly benefit them. Three concrete ways this happens. First, inflation: companies can raise prices faster than they raise pay, so profits and share prices climb while
