          GPUs are good at AI because a neural network is mostly huge piles of matrix multiplication, and a GPU has thousands of small cores that do that math in parallel, fed by very fast memory. Nvidia adds a mature software stack, CUDA,
          so nearly every model runs well on it out of the box. The trade-off is that a GPU stays general purpose. An ASIC is a chip built for one job; Google's TPU is the classic example, hard-wiring the matrix math so less silicon and
          power goes to flexibility. Specialized inference processors are ASICs tuned for running models rather than training them, often keeping weights in large on-chip memory, or built around one architecture like the transformer. A
          specialized chip can beat an Nvidia GPU when the workload is narrow and stable: a fixed model served at huge volume, latency-critical chat where speed per user matters most, or deployments limited by power and cost. It loses when
          models change quickly, when you also need training, or when the software ecosystem matters more than raw efficiency.
  - question_id: A80
    exchanges:
      - answer: >-
          Quantizing means storing each of the model's seventy billion weights with fewer bits. Normally each weight is a sixteen-bit number, which needs about one hundred forty gigabytes. At four bits, each weight takes half a byte, so the
          weights need roughly thirty-five gigabytes; at two bits, a quarter of a byte, roughly seventeen and a half gigabytes. Real files run a bit larger, because formats store scaling factors too, and you need extra memory for the
          context cache while it runs. The trade-offs: four-bit is the popular sweet spot, losing only a little quality on most tasks, and it often runs faster, since generating text is limited by how quickly weights stream from memory.
          Two-bit is much more damaging: the model gets noticeably worse at reasoning, math, instructions and facts, and can become erratic, so it's a last resort to squeeze a big model onto small hardware. As a rule of thumb, a bigger model
          at four bits often beats a smaller one at full precision, but at two bits it can lose to a smaller model at four.
