          Because a stock's value is, in theory, today's value of all the cash it will produce in the future, and interest rates set how heavily the future gets discounted. That's the discounted cash flow idea: a dollar you'll get in ten
          years is worth less than a dollar today, and the higher the interest rate, the less it's worth, because you could have earned that rate safely in the meantime. The effect compounds with time, so cash far in the future shrinks the
          most when rates rise. Many tech and growth companies earn little now and are valued on big profits expected years from now. That makes them long-duration assets, like long-term bonds: a rate increase cuts their present value much
          more than a mature company's that pays cash today. Higher rates add other pressure too: safe bonds and savings compete for investors' money, borrowing gets pricier for unprofitable companies, and a slower economy trims growth
          forecasts. It works in reverse when the Fed is expected to cut.
