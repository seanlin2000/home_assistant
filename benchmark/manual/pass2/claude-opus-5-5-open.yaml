          The search provider sees what leaves your machine in each request: the exact query text, your IP address, your API key, which ties every query to your account, and the time. It doesn't see your conversation, the model's
          reasoning, your documents or the final answer; those stay local. The catch is that the model writes the queries, so if you ask about your medical results or your landlord by name, those details can end up in the query. And if
          your system then fetches the pages it found, each of those websites sees your IP address and which page you read. To minimize exposure, have the model write short, generic queries with names and personal details stripped out.
          Choose a provider with a no-logging or short-retention policy. Route requests through a VPN or proxy so your home IP isn't attached. You can also self-host a metasearch engine like SearXNG, though the engines behind it still see
          the query text. And only search when a question truly needs current information.
  - question_id: A82
