          The Cold War ended less with a battle than with the Soviet system running out of road. The deep causes built up over decades: a stagnant
          command economy that could not keep up with the West, the crushing cost of the arms race and the war in Afghanistan, and resentful
          nationalities inside the Soviet Union itself. Three events turned those pressures into collapse. First, Mikhail Gorbachev's reforms after
          nineteen eighty-five, openness and restructuring, which let people criticize the system without fixing the economy. Second, the
          revolutions of nineteen eighty-nine, when Moscow chose not to send tanks and the Eastern European governments fell one after another,
          symbolized by the Berlin Wall coming down in November. Third, the failed hardline coup of August nineteen ninety-one, which shattered the
          Communist Party's authority and empowered Boris Yeltsin. So the causes were economic decay, military
          overstretch and nationalism. The immediate triggers were the coup and its aftermath: Ukraine voted for independence, the leaders of
          Russia, Ukraine and Belarus agreed to dissolve the union in December nineteen ninety-one, and Gorbachev resigned on Christmas Day.
  - question_id: A77
    exchanges:
      - answer: >-
          Sunlight looks white, but it is really a mix of every color, and the colors behave differently when they bump into the tiny gas molecules
          in the air. Those molecules are much smaller than the waves of light, and they scatter short waves, blue and violet, far more strongly
          than long waves like red. So during the day, blue light gets bounced all over the sky and reaches your eyes from every direction, which
          is why the whole sky looks blue. It is not violet mostly because the sun sends out less violet, some is absorbed high up, and our eyes are
          more sensitive to blue. At sunset the sun is low, so its light has to travel through much more air to reach you. Along that long path,
          most of the blue gets scattered off to the side before it ever arrives. What is left is the reds, oranges and yellows, and dust, smoke
          or haze can make them even deeper.
