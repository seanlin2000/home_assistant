  - question_id: A84
    exchanges:
      - answer: >-
          In theory a stock is worth all the cash it will produce in the future, translated into today's dollars, and interest rates set that
          translation. When the Fed raises rates, safe returns like Treasury yields go up, so investors demand a higher return from risky stocks
          too, and the discount rate rises. A higher discount rate shrinks the present value of future cash, and it shrinks distant cash the most,
          because the discount compounds every year. That is why growth tech stocks are called long-duration: like a thirty-year bond, most of their
          value comes from profits expected many years out, so a rate hike cuts their value far more than it cuts a utility or a bank that earns
          most of its money now. There are second-order effects too. Unprofitable companies that rely on raising money find funding more expensive,
          bonds become a more attractive alternative, and slower growth can trim corporate tech budgets. It is a tendency, not a law: if a company's
          earnings grow faster than expected, that can outweigh higher rates.
