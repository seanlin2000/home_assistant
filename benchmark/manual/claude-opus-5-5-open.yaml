          Because the stock market and an ordinary person's wallet measure different things. Stocks track the expected future profits of big public
          companies, and most shares are owned by the wealthiest households, so a rising market mostly lifts people who already have assets. Three
          concrete ways the gap opens up. First, profits can rise while wages lag: if companies hold prices high or cut labor costs, profit margins
          grow and share prices climb, while paychecks fall behind rent and groceries. Second, inflation and interest rates hit people unevenly: a
          renter carrying a credit card balance feels higher prices and borrowing costs right away, while an investor's portfolio can keep rising
          on good earnings news. Third, the market is concentrated and global: a handful of giant tech companies can carry the whole index on AI
          spending or overseas sales, even as local hiring, small businesses and housing affordability get worse. On top of that, markets look
          forward, betting on future earnings, while people feel today's costs, so the two can drift apart for years.
  - question_id: A79
