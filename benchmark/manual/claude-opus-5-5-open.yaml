      - answer: >-
          GPUs are good at AI inference because running a neural network is mostly huge matrix multiplications, and a GPU has thousands of small
          cores that do those in parallel, plus very fast high-bandwidth memory and NVIDIA's mature CUDA software, which nearly every AI framework is
          built around. When generating text one token at a time, the bottleneck is often how fast the chip can stream the model's weights from
          memory, not raw math. A GPU is general-purpose: it runs any model and handles training too. An ASIC is a chip designed for one job, like
          Google's TPU, trading flexibility for efficiency. Specialized inference processors are ASICs built just for serving models, for example
          chips that keep weights in large on-chip memory, wafer-sized chips, or designs hard-wired for transformers. A specialized chip can beat an
          NVIDIA GPU when the model architecture is stable, the workload is huge and predictable, and what matters most is speed per user, cost per
          token, or power. GPUs stay ahead when models change quickly, when you also need training, or when software support matters most.
  - question_id: A80
    exchanges:
      - answer: >-
          Quantizing means storing each of the model's weights with fewer bits. Normally each weight takes sixteen bits, two bytes, so a
          seventy-billion-parameter model needs about a hundred forty gigabytes just for its weights. At four bits each weight is half a byte, so
          roughly thirty-five gigabytes; at two bits, roughly seventeen and a half. Real formats add some overhead for scaling factors, so expect
          closer to forty gigabytes at four-bit and somewhat over twenty at two-bit, plus extra memory for the conversation's key-value cache, which
          grows with context length. The trade-offs: four-bit is the sweet spot, usually losing only a little quality while letting the model fit on
          far cheaper hardware and run faster, since generation speed is limited by memory bandwidth. Two-bit is much rougher: the model gets
          noticeably worse at reasoning, math, code and following instructions, and makes stranger mistakes. A useful rule of thumb is that a
          bigger model at four bits often beats a smaller model at full precision, but a model squeezed to two bits often loses to a smaller one
          at four.
  - question_id: A81
    exchanges:
      - answer: >-
          What stays local is the model itself, your full conversation, your files, and the final answer. What goes out is each search query the
          model writes, and the search provider sees it along with your IP address, your API key, which ties every search to your account and
          payment details, and the timing. That matters because a model can leak context into a query, say a medication name together with your
          town. If your system also downloads the pages it finds, each of those websites sees your IP address too. To minimize exposure, have the
          model write short, generic keyword queries and strip names, addresses and personal details before anything leaves. Search only when
          needed, and cache results so repeat questions stay local. Choose a provider with a clear no-logging or zero-retention policy, or self-host
          a metasearch engine like SearXNG, though it still forwards queries to the engines behind it. A VPN or proxy hides your home IP address,
          but not the query text. And never pass documents or conversation history to the search tool.
  - question_id: A82
    exchanges:
      - answer: >-
          An API is a defined way for one program to ask another for something, such as a search engine's query endpoint. A tool, in LLM terms, is a function the model is allowed to call: it has a name, a description and typed arguments, and
          your software runs it when the model asks and feeds the result back. An MCP server is a standard way to package tools: it exposes them
          over the Model Context Protocol, so any compatible client can discover and call them. For your system, run the
          model locally with a server such as llama.cpp that supports tool calling, plus a small agent loop. Build one MCP server with two tools:
          search, which calls a search API such as Brave or a self-hosted SearXNG and returns titles and snippets, and fetch page, which downloads
          a page and extracts its main text, trimmed to fit. Summarizing is the model's job: it reads the trimmed passages and answers. Add caching,
          timeouts, a cap on how much text enters the context, and treat web text as untrusted, since pages can hide prompt-injection instructions.
