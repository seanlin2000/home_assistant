      - answer: >-
          Sunlight looks white, but it's really a mix of every color, and each color travels as a wave of a different length.
          Blue light has short, choppy waves, and red light has long, lazy ones. As sunlight passes through the air, it bumps into gas molecules
          far smaller than those waves, and tiny particles like that scatter short blue waves several times more strongly than long red ones.
          So during the day, blue light gets bounced all around the sky, and wherever you look, some of that scattered blue is heading toward your eyes.
          That's why the whole sky glows blue. Violet scatters even more, but sunlight contains less of it and our eyes are less sensitive to it.
          At sunset, the sun sits low, so its light has to travel through far more air to reach you. Along that long path, most of the blue gets scattered away
          before it arrives, and what's left is orange and red. Dust, smoke and moisture in the air can deepen those colors even further.
