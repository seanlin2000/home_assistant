          GPUs work well for AI because running a neural network is mostly enormous batches of matrix multiplication, and a GPU has thousands of simple cores
          built to do the same math in parallel, plus very fast memory and a mature software stack, NVIDIA's CUDA, that every framework supports.
          A GPU is still general purpose: it can train and serve almost any model and adapts as architectures change. An ASIC is a chip designed for one job;
          Google's TPU is the classic example, hard-wiring the matrix math so less silicon and power go to flexibility. Specialized inference processors are ASICs
          tuned only for running trained models, and they often attack the real bottleneck, memory bandwidth, by keeping weights in on-chip memory,
          or by hard-wiring the transformer itself. A specialized chip can beat an NVIDIA GPU when the workload is huge and stable: a fixed model architecture
          served at scale, where speed per user, cost per token or power use matter most. It loses when models change quickly, when you also need training,
          or when software support and flexibility matter more than raw efficiency.
  - question_id: A80
