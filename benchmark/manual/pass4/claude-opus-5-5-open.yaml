      - answer: >-
          In theory, a stock is worth all the cash it will ever generate, with each future dollar discounted back to today. The discount rate starts from the safe interest rate,
          like Treasury yields, plus a premium for risk. When the Fed raises rates, Treasury yields usually rise, so the discount rate rises and every future dollar is worth less today.
          The key is that the penalty compounds with time. A dollar arriving next year barely changes in value; a dollar arriving in fifteen years shrinks a lot.
          That's why growth tech stocks are called long-duration assets: much of their value comes from profits expected far in the future,
          so they behave like long-term bonds and are very sensitive to rates. A mature company paying steady cash now, like a utility, is short-duration and hurt less.
          Higher rates also hit tech in other ways: borrowing to fund growth costs more, safe bonds become a more attractive alternative, and investors pay lower multiples of earnings.
          The rate hikes of twenty twenty-two, when the Nasdaq fell about a third, are the classic example.
