          The model, its weights, your full conversation, your files and the model's reasoning all stay on your machine. What leaves is each search query the model writes,
          sent over an encrypted connection to the search provider. The provider sees the query text, your IP address and so your rough location,
          your API key, which ties every query to your account and billing details, and the timing and volume of your searches.
          Queries can be revealing, because a model often folds in context like your neighborhood, a health issue or a person's name.
          If your system also fetches the result pages, those websites see your IP address too. To minimize exposure, have the model write short, generic queries
          with personal details stripped out; search only when a question needs it, not on every turn; choose a provider with a no-logging or zero-retention policy;
          route search and page fetches through a VPN or proxy; or run a self-hosted metasearch engine like SearXNG, which spreads queries across engines without an account.
  - question_id: A82
