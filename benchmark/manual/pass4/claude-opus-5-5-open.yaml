      - answer: >-
          A software tool is simply a capability, like a function that searches the web or reads a page. An API is a contract for calling a service over the network,
          with defined requests and responses, such as a search engine's web interface. An MCP server, short for Model Context Protocol, is an adapter built for language models:
          it wraps one or more tools, describes each with a name, purpose and argument schema the model can read, and runs them when the model asks,
          so any MCP-aware app can plug them in. For your system, I'd run the model locally behind a server like llama.cpp or Ollama, with an orchestrator handling the conversation loop.
          Beside it, one MCP server offers three tools: search, which calls a search API or a self-hosted SearXNG and returns titles, links and snippets;
          fetch, which downloads a page and extracts the main text; and read, which splits long pages and returns only the relevant passages.
          The model decides when to search, reads the trimmed results and writes the summary itself. Add timeouts and length limits, and treat web text as untrusted.
