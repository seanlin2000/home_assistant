      - answer: >-
          Quantizing means storing each of the model's seventy billion weights with fewer bits. Normally each weight is a sixteen-bit number, two bytes,
          so the weights take about a hundred and forty gigabytes. At four bits, each weight is half a byte, so roughly thirty-five gigabytes;
          at two bits, a quarter of a byte, so roughly seventeen and a half. Real formats also store scaling factors for groups of weights,
          so expect closer to forty gigabytes at four bits and around twenty at two, plus extra memory for the context cache while it runs.
          The trade-off is precision. Four-bit is the sweet spot: the model fits on a single large GPU or a sixty-four gigabyte Mac and usually loses only a little quality,
          most noticeably on math, code and long reasoning. Two-bit is much harsher: each weight can take only four values, so the model makes more mistakes,
          drifts from instructions and can turn incoherent, though newer methods soften this. In exchange you get far less memory and,
          since generation speed is limited by memory bandwidth, faster output.
  - question_id: A81
