        answer: >-
          Quantizing means storing each of the model's seventy billion weights with fewer bits. Normally each weight is a sixteen-bit number; at four-bit you round each to one of sixteen levels, and at two-bit to just four levels, with shared scale factors per small block of weights.
          At sixteen bits the weights take about a hundred and forty gigabytes. At four bits that drops to about thirty-five gigabytes, and at two bits to about seventeen and a half. In practice add a few gigabytes, since real formats mix in scale values and keep some layers at higher precision, and you need extra memory for the context cache while it runs.
          The trade-offs: smaller models fit on cheaper hardware and run faster, because generation speed is mostly limited by how fast memory can be read. But you lose accuracy. Four-bit is usually close to the original for everyday use, with small losses in reasoning, math and rare facts. Two-bit degrades much more noticeably, with more errors and garbled output, so a smaller model at four-bit often beats a big one at two-bit.
