          With a thousand dollars, I'd build it around one capable local computer plus a couple of cheap voice satellites.
          The brain could be a Mac mini with sixteen or twenty-four gigabytes of memory, or a small PC with a used twelve-gigabyte graphics card, at roughly six to eight hundred dollars. Run Home Assistant for device control, Whisper for speech-to-text, Piper for text-to-speech, and a language model of roughly eight to twelve billion parameters at four-bit quantization through llama dot cpp or Ollama. Put a small voice satellite with a good microphone and wake word in each room for about fifty to sixty dollars apiece. Add web search through a tool server that calls a search API.
          The biggest limitations are that small models know less, reason worse and sometimes skip tool calls, latency adds up across listening, thinking and speaking, and far-field microphones struggle with noise.
          Build in this order: first Home Assistant with local voice control of your devices, since that's useful immediately; then the language model for conversation; then web search.
