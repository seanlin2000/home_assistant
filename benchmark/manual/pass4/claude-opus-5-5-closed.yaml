      - answer: >-
          Because a stock is worth the cash it will produce in the future, translated into today's dollars, and higher interest rates make future dollars worth less today.
          Investors value a company with what's called a discounted cash flow: they estimate its future profits and shrink each year's amount by a discount rate, which starts from the risk-free interest rate plus a premium for risk. When the Fed raises rates, that discount rate rises, and every future dollar gets shrunk more.
          The effect compounds with time. A dollar expected next year barely changes, but a dollar expected fifteen years from now loses a lot of its present value. Mature companies like utilities earn most of their cash soon, so they're less affected. Fast-growing tech companies often expect most of their profits far in the future, which makes them long-duration assets, a bit like long-term bonds, and so their valuations fall harder.
          Higher rates also raise borrowing costs for growth companies, and make safe bonds a more attractive alternative, pulling money out of riskier stocks.
