          Because the stock market measures the profits of large companies, mostly owned by wealthier households, while people feel the economy through wages, prices and jobs. Those can move in opposite directions.
          First, ownership is concentrated. In the United States the richest tenth of households own the large majority of stocks, so a soaring market mainly lifts people who already have savings, while a renter living paycheck to paycheck gets nothing from it.
          Second, profits can rise at workers' expense. If companies raise prices faster than they raise pay, or cut staff and automate, margins and share prices climb even as households' real purchasing power falls. Inflation in groceries, rent and insurance hits ordinary budgets directly.
          Third, the index is not the local economy. A handful of giant firms, often tech companies earning revenue worldwide, can drive the whole market up, while small businesses, manufacturing towns or certain regions are struggling. Add expensive housing and high borrowing costs, and an average person can feel squeezed while headlines celebrate record highs.
