          The search provider sees whatever is in each search request, and nothing else from your machine.
          What stays local is the model itself, your full conversation, your prompts, any files or smart-home data the model reads, and its reasoning. What gets sent is the search query the model writes, which can include personal details if the model copies them from your question, plus your IP address, the API key tied to your account and payment details, and timestamps. Over time the provider can build a profile from the pattern of queries. And if your system then fetches the result pages, each of those websites sees your IP address and that someone visited.
          To minimize exposure, have the model write short, generic keyword queries and strip names, addresses and health or money details. Only search when the question really needs current information. Pick a provider with a clear no-logging policy, route requests through a VPN or proxy if your IP matters, cache repeat results, and keep anything sensitive answered from local data alone.
