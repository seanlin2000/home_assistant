          It comes down to sunlight being a mix of all colors, and the air scattering some colors more than others.
          Sunlight looks white, but it contains every color of the rainbow. Each color travels as a wave, and blue light has short, choppy waves while red has long, lazy ones. The tiny molecules of nitrogen and oxygen in the air are much better at bouncing short waves around, so blue light gets scattered in every direction across the whole sky. Wherever you look, some of that bounced blue reaches your eye, so the sky looks blue. It isn't violet mostly because there's less violet in sunlight and our eyes are less sensitive to it.
          At sunset the sun is low, so its light has to travel sideways through far more air to reach you. By the time it arrives, most of the blue has been scattered away along the route, and what's left is the long-wave reds and oranges. Dust, smoke and moisture near the horizon can deepen those colors even further, which is why some sunsets are especially vivid.
