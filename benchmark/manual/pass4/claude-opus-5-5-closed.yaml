          An API is just an interface: a defined way for one program to ask another for something, like a search company's web endpoint that takes a query and returns results. A tool, in the language model sense, is a function the model is allowed to call, described by a name, a purpose and the arguments it takes. An MCP server is a program that speaks the Model Context Protocol, a standard way to offer a set of tools to any compatible model application, so you write the tools once and plug them into different assistants.
          For your system, run the model locally with something like llama dot cpp or Ollama, inside a small harness that acts as the MCP client. Build one MCP server with two tools: search, which calls a search API and returns titles, links and snippets, and fetch page, which downloads a page, strips it to its main text and trims it to fit the context. Summarizing is the model's own job, so it reads those results and answers. Mark fetched text as untrusted, cap lengths, and keep the tool list short so a small model chooses well.
