          An API is a defined way for one program to talk to another, usually over the network, like a weather service you can send requests to. An MCP server, from the Model Context Protocol, is a program that exposes capabilities to an AI model in one standard format, so any compatible app can discover and call them. A tool is a function the model can call, like search or read a page. An API often sits behind a tool, and an MCP server packages tools. For your local model, I would build it like this. Run the model locally with a tool-calling runtime. Add an MCP server that exposes three tools: search, which calls a search API or your own self-hosted search engine and returns titles and snippets; fetch page, which downloads a URL and extracts the readable text; and optionally a summarize step, which is just the local model reading the extracted text. A simple loop lets the model call these tools, feeds results back as untrusted text, and returns the answer, with timeouts and a cap on tool calls.
