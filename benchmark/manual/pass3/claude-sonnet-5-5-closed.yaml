          Those are two separate problems. For the choppy audio, the likely causes are Bluetooth interference and bandwidth. Bluetooth shares the 2.4 gigahertz band with Wi-Fi, microwaves and other devices, so a busy laptop Wi-Fi connection can crowd it. Distance, obstacles, a weak speaker battery, or the speaker also being connected to another device can all hurt. The laptop may also be using a low-quality codec, or its Bluetooth driver may be old. To troubleshoot, first move the laptop and speaker close with a clear line of sight. Then disconnect the speaker from every other device, and test with the laptop on a 5 gigahertz Wi-Fi band or on ethernet. Update the laptop's Bluetooth and audio drivers, and test the speaker with a phone to see if the fault follows the laptop. If it does, try a wired connection, or a Bluetooth transmitter with a better codec. For the eye strain, think about brightness and contrast in a dark room, lower sharpness and resolution than a monitor, input lag and motion blur, a larger viewing area, and a lack of ambient light. Try lowering projector brightness, adding a soft light behind you, checking the resolution, enabling game mode, and taking breaks.
