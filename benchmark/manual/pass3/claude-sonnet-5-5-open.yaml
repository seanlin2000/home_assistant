          These look like two separate problems. For the choppy audio, the most likely causes are wireless interference, a weak Bluetooth link, or the laptop doing something different from your other devices. Bluetooth shares the two-point-four gigahertz band with Wi-Fi, so a busy router, a microwave, or distance and obstacles can cause stutter. A laptop may also be using a lower-quality audio mode, or the speaker may be connected to two devices at once. To troubleshoot, change one thing at a time. Move the speaker closer, with a clear line of sight. Switch your Wi-Fi to the five-gigahertz band or use a wired connection. Disconnect other Bluetooth devices. Update the laptop's Bluetooth driver. Test the speaker with a phone, to see whether the laptop is the problem. For the eye strain, projectors are usually less sharp, have lower contrast, and are viewed in a dark room, and the picture is bigger, with more input lag or flicker on some models. Try a dim light behind you, lower the brightness, turn on game mode, check the resolution, and take regular breaks.
