          An API is the general way one program talks to another, like a weather service you call over the internet. A tool is a single capability you offer a model, such as search the web, described so the model can ask for it. An MCP server is a standard wrapper that packages tools so any compatible model application can discover and use them without custom code. So the API is the underlying service, the tool is the action, and MCP is the common plug that connects the two to the model. For a local assistant, I would run the model in a local server such as llama.cpp, with a small orchestrator program in front of it. The orchestrator connects to an MCP server offering three tools: search, which calls a search API or a self-hosted engine; fetch, which downloads a page and strips it to readable text; and optionally a summarize step done by the model itself. The model decides when to call the tools, the orchestrator runs them, truncates long pages to fit the context window, and feeds results back until the model gives a final answer.
