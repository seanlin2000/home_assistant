          GPUs shine at AI because running a neural network is mostly huge matrix multiplications, and a GPU has thousands of simple cores
          doing those in parallel, fed by very fast high-bandwidth memory. Just as important is NVIDIA's software, CUDA and its libraries,
          which nearly every AI framework is built on. An ASIC is a chip designed for one job. Google's TPU is the classic example,
          giving up a GPU's flexibility for efficiency on neural-network math. Specialized inference processors are ASICs aimed at serving
          models rather than training them, such as Groq's chips that keep the model in on-chip memory, Cerebras's wafer-sized processor,
          or Etched's chip built only for transformers. A specialized chip can beat an NVIDIA GPU when the workload is narrow and stable,
          like one model architecture served at enormous volume; when speed per user matters more than total throughput, since generating text
          is limited by memory bandwidth, which on-chip memory attacks directly; and when power and cost per token dominate.
          The risk is that if model designs change, a narrow chip can become obsolete while the GPU adapts.
  - question_id: A80
    exchanges:
      - answer: >-
          Quantizing means storing each of the model's weights with fewer bits. Normally a weight takes sixteen bits. Quantization rounds it
          to one of a small set of values, sixteen possible values at four bits and just four at two bits, plus a shared scale factor
          for each small block of weights. For seventy billion parameters, sixteen-bit weights need about one hundred forty gigabytes.
          At four bits that drops to about thirty-five gigabytes, closer to forty in practice once you count the scale factors.
          At two bits it's about seventeen and a half gigabytes, realistically around twenty. You also need memory for the context cache,
          which grows with conversation length. The trade-offs: smaller weights fit on cheaper hardware and usually run faster, because
          generating text is limited by how quickly memory can be read. But you lose precision. Four-bit models are generally close
          to the original, with a small drop in accuracy. Two-bit models degrade noticeably, with more factual errors, weaker reasoning,
          and sloppier instruction-following and tool use, so a smaller model at four bits often beats a bigger one at two.
  - question_id: A81
