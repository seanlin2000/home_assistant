        answer: >-
          Because a stock's value is, in theory, all the cash it will ever produce, with each future dollar discounted back to today,
          and that discount rate rises when interest rates rise. When the Fed raises rates, safe assets like Treasury bonds pay more,
          so investors demand a higher return from risky stocks too. A higher discount rate shrinks the present value of every future dollar,
          but it hits distant dollars much harder, because the discount compounds every year. A dollar ten years away is worth about seventy-four cents
          today at a three percent rate, but only about fifty-six cents at six percent. Mature companies like utilities earn most of their cash soon,
          so they're less affected. Growth tech companies are the opposite: much of their expected value comes from profits a decade or more out,
          which is why they're called long-duration assets, like a long-term bond whose price swings most when rates move. Higher rates also make
          it costlier for unprofitable companies to raise money, and they slow the economy, which can shrink those future profits themselves.
