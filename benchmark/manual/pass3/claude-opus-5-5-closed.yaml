      - answer: >-
          The search provider sees only what you send it, but that's more than people expect. What gets transmitted is the text of each query,
          your IP address, which reveals your rough location and internet provider, the time, and your API key, which ties every query
          to your account and probably your payment details. If your assistant then fetches the result pages, each of those websites sees
          your IP address too. What stays local is the model itself, your full conversation, your prompts, and anything the model works out
          without searching. The catch is that the model writes the queries, so if you mention your doctor or your address and it searches
          on that, the detail leaves your machine. To minimize exposure, have the assistant search only when needed and strip personal details
          from queries, pick a provider with a clear no-logging policy, route traffic through a VPN or proxy to hide your IP, or self-host
          a metasearch engine like SearXNG, which needs no account. And cache results locally so repeat questions don't go back out.
  - question_id: A82
    exchanges:
      - answer: >-
          An API is a contract that lets one program call another, like a search engine's web endpoint that takes a query and returns results.
          A tool, in the language-model sense, is one function described to the model with a name, a purpose and typed arguments,
          so the model can ask for it to be run. An MCP server is a program that speaks the Model Context Protocol, a standard way to package
          a set of tools so any compatible assistant can discover and call them; inside, it usually calls APIs. For your setup, run the model
          on a local server such as llama.cpp, with a small client loop that sends the conversation and tool descriptions, executes any tool call
          the model makes, and feeds back the result. Then write one MCP server with a search tool that calls a search API or self-hosted SearXNG,
          a fetch tool that downloads a page and extracts only the readable text, trimmed to fit the context window, and a combined
          search-and-read tool so a small model needs just one call. Summarizing stays the model's job. Treat all web text as untrusted, and cap result sizes.
