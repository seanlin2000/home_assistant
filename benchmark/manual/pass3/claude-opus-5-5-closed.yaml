          It comes down to how sunlight bounces off the air itself. Sunlight looks white, but it's a mix of every color.
          The tiny nitrogen and oxygen molecules in the air scatter short wavelengths, the blues and violets, much more strongly
          than long ones like red. Physicists call this Rayleigh scattering. So during the day, wherever you look away from the sun,
          you're seeing blue light that has been bounced around the sky and redirected toward your eyes. It isn't violet because sunlight
          has less violet to begin with and our eyes are less sensitive to it. At sunset the sun is low, so its light travels sideways
          through a much thicker slice of atmosphere to reach you. Along that long path, most of the blue gets knocked off in other directions,
          and what survives is red, orange and yellow. Dust, smoke and moisture can strengthen the effect, which is why some sunsets are so vivid.
          Picture a long, crowded hallway where blue keeps getting bumped aside while red walks straight through.
