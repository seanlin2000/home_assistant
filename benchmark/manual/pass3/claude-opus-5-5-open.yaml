          The Cold War ended between 1989 and 1991, when the Soviet bloc came apart almost peacefully, and the Soviet Union formally dissolved at the end of December 1991, right after Gorbachev resigned.
          Three events mattered most. First, Gorbachev's reforms from 1985, glasnost and perestroika, which loosened censorship and tried to revive the economy, but instead exposed its failures and let people criticize the system openly.
          Second, 1989, when Moscow refused to send in tanks to prop up its allies, so communist governments in Eastern Europe fell one after another and the Berlin Wall came down.
          Third, the failed hardline coup in August 1991, which discredited the old guard, made Boris Yeltsin the dominant figure, and pushed the republics to declare independence.
          The distinction: the causes were long-running, a stagnant planned economy, falling oil revenue in the mid-1980s, the cost of the arms race and the war in Afghanistan, and nationalism in the republics.
          The immediate triggers were the coup and what followed, especially Ukraine's independence vote in December 1991, after which Russia, Ukraine and Belarus agreed to dissolve the Union.
  - question_id: A77
