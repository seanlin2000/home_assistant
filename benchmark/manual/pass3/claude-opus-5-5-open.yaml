  - question_id: A84
    exchanges:
      - answer: >-
          It comes down to how investors value future money. A stock is worth the cash the company will produce in the future, translated back into today's dollars. That translation is the discounting step: each future dollar is shrunk by a discount rate, and that rate is built on top of the risk-free interest rate.
          When the Fed raises rates, Treasury yields rise, so the discount rate rises, and every future dollar is worth less today. Compounding makes this much harsher for dollars far in the future than for dollars next year.
          That's why growth tech stocks are called long-duration assets: much of their value comes from profits expected ten or twenty years out, so a higher rate shrinks their present value far more than it does for a utility or bank that earns most of its cash now.
          Higher rates also hurt in practical ways: borrowing to fund growth gets more expensive, safe bonds become a real alternative to risky stocks, and customers may slow spending. The reverse holds too, which is why tech stocks often rally when rate cuts are expected.
