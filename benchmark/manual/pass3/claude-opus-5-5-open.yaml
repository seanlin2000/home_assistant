      - answer: >-
          GPUs are good at AI inference because running a model is mostly huge amounts of the same simple math, multiplying big grids of numbers, and a GPU has thousands of small cores that do that in parallel. They also have very fast memory, which matters because generating each word means streaming the whole model through the chip. And Nvidia's software, CUDA and its libraries, means nearly every model runs well on day one.
          An ASIC is a chip designed for one job. Google's TPU is an example: it drops the graphics and general-purpose parts and devotes the silicon to matrix math, so it's more efficient but less flexible. Specialized inference processors are ASICs aimed purely at running models, like Groq's chips with lots of on-chip memory, Cerebras's wafer-sized chip, or Etched's chip that hard-wires the transformer.
          A specialized chip can beat an Nvidia GPU when the workload is huge and stable enough to tune the design to it, when low latency per user matters most, when memory bandwidth is the bottleneck, and when power and cost per answer outweigh flexibility.
  - question_id: A80
    exchanges:
      - answer: >-
          Quantizing means storing each of the model's weights with fewer bits. Normally a 70-billion-parameter model uses 16 bits per weight, which is about 140 gigabytes.
          At 4 bits, each weight takes half a byte, so the weights need about 35 gigabytes, and around 40 in practice once you add the scaling factors that formats like GGUF store alongside them. At 2 bits, it's about 17 and a half gigabytes in theory, more like 20 to 26 in practice. You also need memory beyond the weights for the conversation itself, the key-value cache, which grows with context length.
          The trade-offs: 4-bit usually stays close to the original quality, with a small loss on benchmarks, while letting the model fit on a single high-memory machine and run faster, since generating text is limited by how fast memory can be read. At 2-bit, quality drops noticeably: more factual mistakes, weaker reasoning and math, and broken formatting or tool calls. That's why a smaller model at 4-bit often beats a bigger one at 2-bit. Long-context and multilingual tasks tend to suffer first.
  - question_id: A81
    exchanges:
      - answer: >-
          The search provider only sees what you send it, but that can be revealing.
          What stays local: your full conversation, your prompts, any documents or personal data the model reads, and the model's answers. None of that leaves your machine unless your software puts it into the search request.
          What gets transmitted: the search query text itself, your IP address, which hints at your location, the time of the request, and your API key, which ties every query to your account and payment details. Over time, a log of queries can paint a detailed picture of your interests, health or plans. And if your assistant then opens the result pages, each of those websites sees your IP address too.
          To minimize exposure: have the model write short, generic queries that leave out names, addresses and other personal details; never send conversation history as part of the query; pick a provider with a clear no-logging policy, or self-host a meta-search engine like SearXNG; route searches and page fetches through a VPN or proxy; and use a separate account and API key just for this.
  - question_id: A82
    exchanges:
      - answer: >-
          An API is a contract for how one program asks another for something, like a search service's web address that takes a query and returns results. A tool, in the language model sense, is a single function the model is allowed to call, described by a name and arguments, like search with a query. An MCP server is a standard way to package tools so any compatible model app can discover and call them; it usually wraps APIs behind the scenes.
          For your system, I'd run the model locally with something like llama.cpp or Ollama, using a model that supports tool calling. Then build a small MCP server with two tools: a search tool that calls a search API, or a self-hosted SearXNG, and returns titles, links and snippets; and a fetch-page tool that downloads a page and strips it to its main readable text, trimmed to fit the context. Summarizing is the model's job, not a tool. A client loop sends the question, runs the tool the model asks for, and feeds results back until it answers. Treat web text as untrusted.
