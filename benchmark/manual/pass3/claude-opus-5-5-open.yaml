      - answer: >-
          It comes down to how air scatters sunlight. Sunlight looks white, but it's a mix of all colors, and each color travels as a wave of a different length: blue waves are short, red waves are long.
          The tiny gas molecules in air bounce short blue waves around far more than long red ones, roughly five times more for blue than red. So during the day, when you look anywhere in the sky away from the sun, you're seeing blue light that's been bounced toward you from all directions. That's why the whole sky glows blue. It isn't violet, even though violet scatters more, because sunlight has less violet and our eyes are less sensitive to it.
          At sunset, the sun is low, so its light travels sideways through much more air to reach you. Along that long path, most of the blue gets scattered away before it arrives, and what's left is the oranges and reds. Dust, smoke and haze make that effect even stronger, which is why sunsets after wildfires can be so vivid.
