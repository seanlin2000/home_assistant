          Because the stock market measures the profits of big companies and the hopes of investors, not the day-to-day finances of a typical household, and the two can move apart.
          First, ownership is lopsided. Most stock is held by the wealthiest households, so when prices soar, their wealth grows, while a renter with no investments gains nothing and may see rent rising.
          Second, profits can rise at the workers' expense. When companies cut staff, hold down wages, or raise prices faster than their costs, as many did during the recent inflation, earnings and share prices go up, while families pay more for groceries, rent and insurance and their paychecks don't keep up.
          Third, a few giant companies can carry the whole index. A handful of large tech firms earning money worldwide, for example from AI spending, can lift the market even while local job markets, small businesses and housing affordability are getting worse.
          On top of that, the market looks ahead, so it can rally on expected rate cuts or future growth that ordinary people haven't felt yet.
