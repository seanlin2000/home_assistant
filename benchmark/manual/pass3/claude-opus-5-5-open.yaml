      - answer: >-
          Here's how I'd build it for about a thousand dollars.
          Put everything on one always-on machine: an Apple Silicon Mac mini with as much memory as the budget allows, or a small PC with a used graphics card with 12 to 16 gigabytes of video memory. Prices move, so check current ones.
          On it, run five pieces: Home Assistant as the smart-home hub; Whisper for speech-to-text; a local language model of roughly 8 to 14 billion parameters through llama.cpp or Ollama; Piper for the voice; and a web-search tool the model can call, through a search API or self-hosted SearXNG. Cheap satellite speakers with microphones stream audio to the hub.
          The biggest limitations are that small local models know less and reason worse than cloud ones, responses can feel slow, and far-field wake-word detection is often unreliable.
          Build in this order: first, Home Assistant controlling your devices by voice, since that's the most useful and reliable; then the local model for general questions; then web search; and last, polishing conversation and speed.
