          For multiple people, invite everyone into your Hue home in the Hue app, or put the bridge into Apple Home or Google Home and share that home with them. For voice, link the bridge to whichever assistant you use: Siri through Apple Home, Alexa, or Google. If you want one place for everything, Home Assistant can connect to the bridge locally and expose the lights to all of those. Add a couple of Hue dimmer switches for guests.
