          - {name: search_and_read, arguments: {query: "why NVIDIA GPU prices rising 2026 memory shortage supply", time_range: "month"}}
        answer: >-
          The main thing that changed is memory, not the GPU chips themselves. The AI data center buildout is swallowing the world's memory production, so manufacturers like SK hynix, Samsung, and Micron have moved their factories toward high-margin server and AI memory. That has cut output of the GDDR6 and GDDR7 memory graphics cards use. Memory contract prices have climbed all through 2026, and the fixed-price memory deals card makers relied on expired at the end of 2025, so the higher costs flowed straight through. Card makers responded with price increases and production cuts, hitting the highest-memory cards hardest, and scalping made it worse. An RTX 5090 that launched at 1,999 dollars has been seen at 4,000 to 5,000. Micron said on October 1st that demand will outrun supply into 2028, so analysts don't expect real relief before then.
