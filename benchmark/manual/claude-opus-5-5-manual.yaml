questions:
  - question_id: A1
    exchanges:
      - answer: >-
          Two different numbers are at play. The memory you need depends on every parameter the model has, because all of them have to be stored somewhere. The speed depends on how many parameters are read for each token. A dense 30 billion parameter model reads all 30 billion for every token, and at 4-bit that is roughly 15 to 17 gigabytes before you add the context cache, so on a 16 gigabyte card part of it spills into system RAM and every single token waits on that slow memory. A mixture-of-experts model with 30 billion total but only about 3 billion active still needs room for all 30 billion, but each token only touches a small slice. So you keep the shared layers and cache on the GPU and park the rarely used experts in system RAM, and because so little is read per token, it still runs at a usable speed. The MoE doesn't need less storage; it just tolerates having that storage somewhere slower.
