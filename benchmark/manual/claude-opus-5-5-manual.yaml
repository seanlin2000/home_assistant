  - question_id: A5
    exchanges:
      - answer: >-
          In a 500 square foot room, the microphones matter more than anything else. Look for an array of at least two to four microphones so the device can beamform toward your voice, paired with good echo cancellation so it can hear you while it's talking, which is what makes natural back-and-forth and interrupting possible. Noise suppression and automatic gain help with fans, traffic, and a TV. Keep the speaker acoustically isolated from the microphones, since vibration through the case ruins echo cancellation. Run the wake word locally and keep the speech pipeline fast, because latency is what makes conversation feel natural. Place it centrally, around head height, away from walls, corners, and noisy appliances. And plan for a physical mute switch and clear light or sound feedback so you know when it's listening.
