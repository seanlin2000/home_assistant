        answer: >-
          A 4 percent increase looks roughly at market, maybe slightly above it. The listing data I found shows Long Island City rents up only about 1 to 4 percent over the past year: RentCafe puts the average near 4,800 dollars, up about 1.3 percent, and another estimate puts it up about 3.9 percent. Month to month, LIC rents have been basically flat. Queens as a whole rose about 3 to 4 percent. So 4 percent a year isn't a bargain, but it isn't out of line either, and locking in two years protects you if the market heats up. Be careful with these comparisons, though. Advertised rents are asking prices, not signed leases, and new towers often offer a month or two free, so the real effective rent can be lower. Averages also mix luxury units with older ones, and renewal tenants usually get smaller increases than new listings suggest. Moving costs also count in favor of staying. Comparing against actual listings in your own building and unit size is the better test, and you could ask about concessions to negotiate.
  - question_id: B17
    exchanges:
      - queries:
          - "Home Assistant Voice Preview Edition custom wake word"
        answer: >-
          Yes, but not out of the box. On the stock firmware, the wake word runs on the device itself and you can only choose from the built-in options: Okay Nabu, Hey Jarvis, and Hey Mycroft. For a truly custom wake word, you either build your own firmware with ESPHome that includes a custom-trained wake word model, or stream the audio to Home Assistant and let the openWakeWord add-on detect your custom word there. There is an experimental streaming firmware and a community project for that. I trusted Nabu Casa's own support article most for the stock options, because they make the device and it's official documentation. The custom routes come from the experimental firmware and community GitHub projects, which show it's possible but aren't officially supported.
  - question_id: B18
    exchanges:
      - queries:
          - "latest Qwen open-weight models 2026 release sizes"
          - "Qwen3.8-27B 16GB VRAM GGUF quant tokens per second"
        answer: >-
          The newest open Qwen generation is 3.8, released in August, and the one realistic for 16 gigabytes is Qwen3.8 27B, a dense model. The others are huge server models. At the usual 4-bit quality level it's about 17 gigabytes, which doesn't fit, so on 16 gigabytes you drop to a smaller 4-bit variant around 15.7 gigabytes or a 3-bit one around 13.8. That leaves only about 3 gigabytes for context, but only a quarter of its layers keep a context cache, so one user still runs it with a 64 thousand token window. The alternative is Qwen3.6 35B A3B, a mixture-of-experts model with only about 3 billion active parameters. It doesn't fit entirely either, but its experts can sit in system RAM with only a small speed hit, so it stays fast and leaves room for longer context, though the dense 27B is generally the stronger model. Smaller options like Qwen3.5 9B fit easily at higher precision and run fastest, at a clear quality cost. Basically, the more you compress, the more memory you free for context and speed, and the more quality you give up.
  - question_id: B19
    exchanges:
      - queries:
          - "RTX 4060 Ti 16GB Qwen3.8 27B tokens per second"
        answer: >-
          The short answer from the sources is yes, but only in reduced form. Qwen3.8's local model is the 27 billion parameter version, and at standard 4-bit it needs more than 16 gigabytes, so on a 4060 Ti you'd run a 3-bit or a trimmed 4-bit build with limited context. Estimates put it around 15 to 25 tokens a second, and one estimator says it drops to just 2 to 4 tokens a second if you force the full 4-bit version and spill into system RAM. That isn't enough to predict a good voice experience. Voice depends on how fast the first word arrives, and that's dominated by processing the prompt, tool results, and search pages, not the generation speed that benchmarks report. It also depends on turning off Qwen's default thinking mode, which can burn thousands of tokens before answering. Then there's how reliably it calls tools at that compression, whether speech recognition and text-to-speech also fit in the same memory, and how long your context gets. You'd need to test with a real prompt and measure time to first spoken word.
