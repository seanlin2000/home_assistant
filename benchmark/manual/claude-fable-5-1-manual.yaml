  - question_id: B18
    turns:
      - queries:
          - Qwen 3.6 models run locally 16GB VRAM quantization
        answer: >-
          The current family is Qwen three point six, and it comes in two sizes that matter for you, a twenty seven billion dense model and a thirty five billion mixture of experts model that only activates about three billion parameters per token. On sixteen gigabytes neither fits at the standard four bit quantization, the dense model needs about eighteen gigabytes there and the mixture needs more than twenty, but both have three bit builds that squeeze in. The tradeoffs work like this. The dense twenty seven billion gives the best quality per parameter but reads every weight on every token, so it is slow and anything spilled out of graphics memory hurts badly. The mixture of experts is larger on disk but much faster because only three billion parameters are active, and it tolerates having some experts in system memory. Going from four bit to three bit saves a few gigabytes at a small but real quality cost. For sixteen gigabytes I would try the thirty five billion mixture at three bit for speed, and the smaller Qwen models in the four to nine billion range if you want it to fit comfortably with room for a long conversation.

