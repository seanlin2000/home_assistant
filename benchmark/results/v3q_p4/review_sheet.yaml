  searched: false
  spoken_answer: 'GPUs win at AI inference mostly because the job they were built to do—thousands of simple cores doing the same kind of operation in parallel—lines up almost perfectly with what a neural network does during a forward pass. A forward pass is dominated by a few big matrix multiplications and a lot of element-wise operations, and a GPU hands you both a huge raw throughput of floating-point operations and, just as importantly, a very wide connection to memory, usually high-bandwidth memory. That memory path is the real story. Inference has two phases that stress a chip differently. The first, where you process the whole prompt at once, is compute-bound, so all those cores shine. The second, where you generate one token after another, is memory-bound: for every single new token you still have to stream in a large chunk of the model''s weights, so the chip''s speed is set less by how fast it can multiply and more by how fast it can move numbers from memory into the arithmetic
    units.'
