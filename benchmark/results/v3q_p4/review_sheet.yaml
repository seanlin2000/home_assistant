- candidate: qwen3.8-flash-next-low
  question_id: A79
  why_selected: random sample
  question: *id004
  searched: true
  spoken_answer: 'GPUs are effective at inference for one structural reason: nearly every layer in a modern neural network reduces to the same few operations — multiply a big matrix by a vector, then a chain of pointwise math like activations, softmax, and layernorm. That is dense linear algebra with no branches and no dependencies between elements, which is exactly what a GPU''s thousands of small cores and matrix units are built for. Modern NVIDIA chips add tensor cores that do the multiply-accumulate in mixed precision, so FP8 and now FP4 formats do more work per watt and per byte of memory traffic.


    The deeper point is that autoregressive decoding — generating a transformer one token at a time — is limited less by how fast you can multiply than by how fast you can read the weights. Reading tens of gigabytes of model weights to produce a handful of new tokens is a low arithmetic-intensity workload, so the bottleneck is memory bandwidth, not FLOPS. That is why GPUs carry high-bandwidth memory stacked on the package, and why each generation has chased bandwidth harder than raw compute.'
