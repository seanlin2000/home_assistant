  spoken_answer: The most likely explanation is ordinary aging. Many plants shed their oldest, lowest leaves as they push new growth up top, and if the plant is otherwise vigorous that is usually normal. The main alternatives are a nitrogen shortage, because nitrogen is mobile and the plant pulls it from old leaves to feed new ones, lower leaves being shaded out by the canopy, or a root problem from overwatering or a pot it has outgrown. Before calling it a problem I would want to know what kind of plant it is, how many leaves are going and how fast, how you water and whether the pot drains, how much light it gets, when you last fertilized, and whether the yellowing is even across the leaf or patterned along the veins. If you tell me the species and your watering routine, I can narrow it down.
