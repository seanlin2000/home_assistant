- candidate: claude-opus-5-5-open
  question_id: A81
  why_selected: random sample
  question: &id005
  - If I run a language model locally on my computer but use an external web-search API, what information can the search provider see? Explain what stays local, what gets transmitted, and how I can minimize data exposure.
  searched: false
  spoken_answer: 'The search provider sees what leaves your machine in each request: the exact query text, your IP address, your API key, which ties every query to your account, and the time. It doesn''t see your conversation, the model''s reasoning, your documents or the final answer; those stay local. The catch is that the model writes the queries, so if you ask about your medical results or your landlord by name, those details can end up in the query. And if your system then fetches the pages it found, each of those websites sees your IP address and which page you read. To minimize exposure, have the model write short, generic queries with names and personal details stripped out. Choose a provider with a no-logging or short-retention policy. Route requests through a VPN or proxy so your home IP isn''t attached. You can also self-host a metasearch engine like SearXNG, though the engines behind it still see the query text. And only search when a question truly needs current information.'
  judge:
    gate_hit: false
    gates: []
    dimension_total: 10
    answer_quality: 5
    judgment: 3
    spoken_fit: 2
    reasons:
