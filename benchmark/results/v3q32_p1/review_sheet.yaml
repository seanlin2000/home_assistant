  question:
  - How did the Cold War end? Explain the three most important events that led to the dissolution of the Soviet Union, and distinguish between the causes and the immediate triggers.
  searched: false
  spoken_answer: 'The Cold War ended not by conquest but by the Soviet Union unravelling from within. The deep causes were structural: a stagnant, over-militarised economy unable to match Western living standards, and the loss of legitimacy that glasnost and perestroika unleashed once open criticism became possible. The immediate triggers were three events. First, 1989, when Poland, Hungary and the rest of the Eastern Bloc broke away peacefully and the Berlin Wall fell, removing the empire the USSR had to defend. Second, the failed hardliner coup in August 1991, which discredited Moscow''s centre and handed real power to Yeltsin and the republics. Third, the December 1991 Belovezha Accords, after which Gorbachev resigned and the USSR was formally dissolved.'
