  question:
  - If I run a language model locally on my computer but use an external web-search API, what information can the search provider see? Explain what stays local, what gets transmitted, and how I can minimize data exposure.
  searched: false
  spoken_answer: 'The search provider sees only what you send it: the search query string, your IP address, and whatever metadata the API includes. It never sees your local files, your full conversation history, or the model''s internal reasoning, because none of that is transmitted.


    Everything else stays local: the model weights, your prompts and chat history, the tool calls your agent makes, and the model''s generated answer.


    To minimize exposure, use a query that carries no sensitive context — have the model paraphrase the search need rather than forwarding raw prompt text. Strip any personal names or details from queries. Use a VPN or proxy to mask your IP, and check the provider''s privacy policy for logging. If possible, prefer a search API that states it does not retain queries.'
  judge:
