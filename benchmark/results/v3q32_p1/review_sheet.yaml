- candidate: qwen3.8-27b-medium
  question_id: A86
  why_selected: random sample
  question:
  - I have Philips Hue lights connected to a Hue Bridge. I want multiple people in my apartment to control the lights, including through voice commands. What is the best architecture for this, and what happens if the internet goes down?
  searched: false
  spoken_answer: 'The Hue Bridge is a Zigbee hub, so your lights talk to it over a short-range radio, not Wi-Fi. That local network works without any internet. For shared control, the cleanest setup is to keep the Bridge and have everyone use the Hue app, or better, run Home Assistant or Apple HomeKit on the local network. Both can drive the Bridge over your Wi-Fi, so several people each get their own app and voice options.


    If the internet drops, everything local keeps working: the Hue app, Home Assistant, and Apple HomePod voice commands still control the lights through the Bridge on your LAN. What breaks is cloud-dependent stuff — remote access from outside the house, and the usual cloud voice assistants like Alexa or Google Assistant, since they need the internet to process your voice. Apple HomeKit is the exception, doing voice locally on the HomePod.


    So the rule of thumb: put your control stack on the local network, and voice stays mostly alive offline; anything routed through the cloud goes dark.'
  judge:
    gate_hit: false
    gates: []
