- candidate: qwen3.8-flash-next-medium
  question_id: A82
  why_selected: random sample
  question: *id001
  searched: false
  spoken_answer: 'An API is a contract: a published way for one program to ask another for data or action, usually HTTP with defined endpoints and responses. A software tool is the concrete capability itself — code that does something, like a function that fetches a URL. An MCP server is neither exactly; it''s a standardized host process that advertises its tools, prompts, and resources to an LLM over a shared protocol, so any compliant model can discover and call them without bespoke glue code. Think API as the interface, tool as the ability, MCP as the wiring that exposes tools to agents uniformly.


    For a local LLM, I''d build tool functions — search, fetch-and-read, summarize — run them in an MCP server the model connects to, and have the model loop: search, pick URLs, fetch, then summarize with retrieved text supplied as context.'
