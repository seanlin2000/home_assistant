  question: &id005
  - If I run a language model locally on my computer but use an external web-search API, what information can the search provider see? Explain what stays local, what gets transmitted, and how I can minimize data exposure.
  searched: false
  spoken_answer: 'The short version is that your model, your conversation, and anything you keep in local files stay on your machine, but the search provider sees the exact query you send it plus the network metadata that comes with any web request. Here''s how I''d sort it out.


    What stays local is everything about the model and the conversation around it. The weights themselves, the full prompt you gave it, the model''s step-by-step reasoning, the intermediate text it generates, and any documents you loaded in from your own disk. None of that crosses the wire just because you''re doing a search.


    What gets transmitted is narrower than people worry about, but it''s the part that matters. When your agent (or you) sends a search request, the provider receives the query text exactly as written, your IP address and so your approximate region and ISP, a timestamp, and whatever headers go along with the request like a User-Agent string or an API key. Then it hands the results back to you, which is fine.'
