  question: &id006
  - What are the five most important developments in open-source AI models over the past 30 days? Compare the latest releases from OpenAI's competitors, including DeepSeek, Qwen, Meta, and Mistral.
  searched: true
  spoken_answer: 'Here''s what I found, drawn from model trackers and vendor announcements, checked as of today. One caveat up front: none of these are "open source" in the strict sense — they''re open weights under custom licenses — and nearly every benchmark number below is the vendor''s own claim rather than an independent result.


