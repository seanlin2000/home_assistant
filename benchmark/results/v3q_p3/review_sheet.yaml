  - I have Philips Hue lights connected to a Hue Bridge. I want multiple people in my apartment to control the lights, including through voice commands. What is the best architecture for this, and what happens if the internet goes down?
  searched: true
  spoken_answer: 'Here''s the setup I''d recommend, based on how Hue and the current assistant platforms work.


    The foundation is what you already have: the Hue Bridge. Wire it to your router with Ethernet, and let all the lights join it over Zigbee. That Zigbee mesh is entirely separate from your Wi-Fi, so the lights don''t depend on Wi-Fi at all. For the people in your apartment, don''t share your login. In the Hue app, go to Settings, then Home access, and send an invite to each person. They sign in with their own Philips Hue account and accept the invite, and now everyone sees the same rooms and scenes and can control them from their own phone, iPhone or Android. If someone moves out, you just remove their access from that same screen.


    For voice, the cleanest approach is to link the Bridge to whichever assistants the household actually uses, and Matter makes that multi-ecosystem control officially supported: you can link Apple Home, Google Home, and Alexa to the same Bridge at once, and that''s called multi-admin support.'
