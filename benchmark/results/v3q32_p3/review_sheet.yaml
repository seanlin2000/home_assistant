  - Why can a country have a strong stock market while its average citizens feel like the economy is getting worse? Give three concrete examples of how this happens.
  searched: false
  spoken_answer: Three mechanisms explain that gap. First, indexes are market-cap weighted, so a handful of mega-cap names drive most of the move; a rally in a few AI-related giants can lift the whole index while the median company, and the median job, stagnate. Second, stock gains only reach people who own stocks, and ownership is heavily concentrated in older, higher-income households, so the largest share of wealth gains goes to those least affected by rent and groceries. Third, companies can raise profits by cutting headcount and automating, boosting earnings and share prices while wages, hours, and job security for everyone else fall.
