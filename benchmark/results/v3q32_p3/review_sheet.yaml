- candidate: qwen3.8-flash-next-medium
  question_id: A82
  why_selected: random sample
  question: *id001
  searched: false
  spoken_answer: 'An API is a contract: a published way for software to request data or actions from another program, usually over HTTP, like a weather service returning JSON. A software tool is a concrete capability bundled for an agent to call — a named function with typed inputs and outputs, such as "search_web(query)". An MCP server sits in between: it''s a standardized server, based on Anthropic''s Model Context Protocol, that exposes tools, prompts, and resources to any compatible client, so one server can serve many agents without custom glue code.


    For your local LLM, I''d run an agent loop around the model, wired to an MCP server exposing three tools: a search API wrapper, a page fetcher that converts HTML to plain text, and a summarizer, either a second local model or the same one with a condensed prompt. Add truncation and caching so long pages don''t blow the context window.'
  judge:
