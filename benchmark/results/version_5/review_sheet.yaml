  question: &id012
  - Explain why VRAM capacity can matter more than raw GPU speed when choosing hardware for a local LLM. Answer in a way that would sound natural if spoken aloud in under 45 seconds.
  searched: false
  spoken_answer: VRAM capacity often matters more than raw GPU speed because large language models require massive amounts of memory to load the model weights and handle context into your computer at once. Even with an incredibly fast processor, you're bottlenecked by how much data fits in that memory; exceeding VRAM forces the system to use slower storage like your hard drive, which dramatically slows performance. For local LLMs specifically, if your RAM is full, the model simply won't run or will degrade so badly it becomes unusable regardless of how fast your GPU can compute.
