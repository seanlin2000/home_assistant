- candidate: qwen3.8-flash-next-medium
  question_id: A82
  why_selected: random sample
  question: *id001
  searched: false
  spoken_answer: 'Three different layers. An API is a contract a service publishes — endpoints, request and response formats — for any client to call over the network. A software tool is one callable capability your agent has: a name, typed arguments, and a return value the model can decide to invoke. An MCP server is a standardized process, using JSON-RPC, that publishes tools, resources, and prompts to any compliant client, so the same toolset works across apps instead of being hardcoded into one.


    For your local LLM: run an agent loop around the model with three tools — search, returning titles, snippets, and URLs from a paid search API; fetch, which downloads a page and strips it to clean text with a token cap; and summarize, either map-reduce over pages or a small dedicated model. Put search and fetch behind an MCP server so they''re reusable.'
  judge:
