- candidate: qwen3.8-27b-medium
  question_id: A81
  why_selected: random sample
  question:
  - If I run a language model locally on my computer but use an external web-search API, what information can the search provider see? Explain what stays local, what gets transmitted, and how I can minimize data exposure.
  searched: false
  spoken_answer: 'The search provider only sees what you send to it, which is essentially your search query, usually a short text string, plus whatever metadata your connection carries, like your IP address, timestamps, and browser or client headers. Your conversation history, prompts, personal documents, and the model''s internal reasoning all stay local on your machine.


    To minimize exposure, strip queries down to the bare minimum, avoid embedding names or sensitive details in them, and if possible route requests through a VPN or proxy to hide your real IP. You can also use a search API that offers anonymous or no-logging tiers, or front it with a local caching layer so repeated lookups never leave your network at all.'
  judge:
