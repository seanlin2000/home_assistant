  question:
  - Why can a country have a strong stock market while its average citizens feel like the economy is getting worse? Give three concrete examples of how this happens.
  searched: false
  spoken_answer: 'The gap comes from what the market measures versus what households actually feel. First, index gains are concentrated: a handful of very large firms can lift the whole index while most companies are flat or falling, so the "market" rising says little about Main Street paychecks. Second, stock ownership is skewed — most households hold little or no equity directly, so rising prices build wealth mainly for those already wealthy, while wages and living costs move independently. Third, markets can reward the *effects* of a shaky economy: aggressive rate cuts, layoffs that boost margins, or inflation that pushes people into assets can lift prices while job security, rents, and groceries get worse. A stock index prices expected corporate profits, not the cost of a household''s life.'
