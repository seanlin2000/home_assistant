- candidate: claude-opus-5-5-open
  question_id: A87
  why_selected: random sample
  question: &id001
  - My projector is connected to a JBL Bluetooth speaker. Sometimes the audio becomes choppy when I connect my laptop, and playing video games on the projector causes more eye strain than playing on my monitor. What could cause these problems, and how would you systematically troubleshoot them?
  searched: false
  spoken_answer: 'Choppy audio is usually Bluetooth interference or a connection conflict. Bluetooth shares the two point four gigahertz band with Wi-Fi, so a laptop on two point four gigahertz Wi-Fi, a nearby router, distance or obstacles can cause dropouts. The speaker may also be juggling devices: if it remembers both the projector and the laptop, it can switch or stutter. To test, unpair the laptop from the speaker, move the speaker within a few feet of the projector, switch the laptop to five gigahertz Wi-Fi, and see whether dropouts follow one device. A wired audio cable removes Bluetooth entirely and also cuts the lag that hurts gaming. Eye strain on a projector often comes from a large, bright image in a dark room, sitting too close, slight focus blur or keystone distortion, input lag or low refresh rate that makes you strain to track motion, and on single-chip DLP projectors, a rainbow flicker. Change one thing at a time: turn on game mode, sharpen focus, check refresh rate, lower
    brightness, add some room light and sit farther back.'
  judge:
    gate_hit: false
    gates: []
