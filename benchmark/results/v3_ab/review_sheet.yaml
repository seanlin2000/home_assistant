  question: &id007
  - Why is the sky blue during the day but red and orange during sunset? Explain the physics in a way that someone without a science background can understand.
  searched: false
  spoken_answer: 'Sunlight looks white, but it is really a mix of all the colors. When that light hits the gas molecules in the air, the short wavelengths, blue and violet, get bounced around much more than the long wavelengths, red and orange. That bouncing is called scattering. During the day the sun is high, so you look up and see blue light that has been scattered all across the sky toward your eyes. Violet scatters even more, but the sun gives off less of it and our eyes are less sensitive to it, so the sky looks blue. At sunset the sun is low, so its light has to travel through a much thicker slice of atmosphere to reach you. Along that long path, most of the blue gets scattered out and sent off in other directions, away from you. What is left to reach your eyes directly is the reds and oranges. Dust and haze can make that even more vivid. So it is the same effect both times: blue is scattered easily, and at sunset it has been scattered away before it gets to you.'
