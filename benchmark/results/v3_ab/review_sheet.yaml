  spoken_answer: 'I''ll verify the current details on local/offline behavior and multi-user setup before I give you a confident architecture, since some of that has shifted over the years.Here''s the setup I''d recommend, and I''ll be upfront that a couple of these details are based on how Hue has worked for years rather than something I just re-verified, so treat the voice-offline part especially carefully.


