<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exchanges</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Exchanges">
      <div class="sidebar-top">
        <span class="brand">Exchanges</span>
        <button type="button" id="new-chat" class="new-chat" title="Start a new conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z M14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          New chat
        </button>
      </div>
      <label class="day-picker"><span>Day (UTC)</span><select id="day"></select></label>
      <nav id="list" class="list"></nav>
      <div class="sidebar-foot">
        <label class="switch"><input type="checkbox" id="follow" checked><span class="toggle"></span>Open new exchanges as they arrive</label>
        <span id="status" class="status" role="status">connecting…</span>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>
    <div class="main">
      <header class="main-head">
        <button type="button" id="sidebar-toggle" class="icon-button" aria-label="Show exchanges">☰</button>
        <span id="model" class="model-name" title="The model that answered the newest exchange"></span>
      </header>
      <main id="thread" class="thread"></main>
      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-box">
          <textarea id="ask-input" rows="1" placeholder="Ask Jarvis anything" aria-label="Question"></textarea>
          <button type="submit" id="ask-send" class="send" aria-label="Ask" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5 M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="composer-note">Typed questions go to the harness on this Mac and are logged with the source “dashboard”. Enter sends, Shift+Enter adds a line.</p>
      </form>
    </div>
  </div>
  <aside id="drawer" class="drawer" hidden aria-label="Full tool result">
    <div class="drawer-head">
      <div id="drawer-title" class="drawer-title"></div>
      <button type="button" id="drawer-close" class="icon-button" aria-label="Close">×</button>
    </div>
    <div class="drawer-tabs">
      <button type="button" data-tab="sources" class="tab active">Sources</button>
      <button type="button" data-tab="raw" class="tab">Raw text the model read</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
  <div id="tooltip" class="tooltip" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
