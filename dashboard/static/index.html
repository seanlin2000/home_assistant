<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Views and history">
      <span class="brand">Assistant Dashboard</span>
      <nav class="nav" aria-label="Views">
        <button type="button" id="new-chat" class="nav-item" title="Start a new conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z M14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          New chat
        </button>
        <button type="button" class="nav-item" data-view="exchanges" aria-current="page">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          Exchanges
        </button>
        <button type="button" class="nav-item" data-view="cache">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          Prompt cache
        </button>
        <button type="button" class="nav-item" data-view="memory">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 2.5v3.5M15 2.5v3.5M9 18v3.5M15 18v3.5M2.5 9h3.5M2.5 15h3.5M18 9h3.5M18 15h3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Memory
        </button>
      </nav>
      <div class="history-head">
        <span id="history-title">History</span>
        <select id="day" aria-label="Day (UTC)" title="Day (UTC)"></select>
      </div>
      <nav id="list" class="list" aria-labelledby="history-title"></nav>
      <div class="sidebar-foot">
        <label class="switch"><input type="checkbox" id="follow" checked><span class="toggle"></span>Open new exchanges as they arrive</label>
        <span id="status" class="status" role="status">connecting…</span>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>
    <div class="main">
      <header class="main-head">
        <button type="button" id="sidebar-toggle" class="icon-button" aria-label="Show views and history">☰</button>
        <span id="model" class="model-name" title="The model that answered the newest exchange"></span>
        <div id="today" class="today-speed" title="Since midnight on this Mac's clock. Times are averages per response; speeds count the tokens read fresh and the tokens written."></div>
      </header>
      <main id="thread" class="thread"></main>
      <main id="cache-view" class="view-page" hidden>
        <div class="page-inner">
          <section id="slots" class="panel" aria-label="Live slots"></section>
          <section id="prompt-layout" class="panel" aria-label="This exchange's prompt"></section>
        </div>
      </main>
      <main id="memory-view" class="view-page" hidden>
        <div class="page-inner">
          <section id="memory-panel" class="panel" aria-label="This Mac's RAM"></section>
        </div>
      </main>
      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-box">
          <textarea id="ask-input" rows="1" placeholder="Ask Jarvis anything" aria-label="Question"></textarea>
          <button type="submit" id="ask-send" class="send" aria-label="Ask" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5 M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="composer-note">Typed questions go to the harness on this Mac and are logged with the source “dashboard”. Enter sends, Shift+Enter adds a line.</p>
      </form>
    </div>
  </div>
  <aside id="drawer" class="drawer" hidden aria-label="Full tool result">
    <div class="drawer-head">
      <div id="drawer-title" class="drawer-title"></div>
      <button type="button" id="drawer-close" class="icon-button" aria-label="Close">×</button>
    </div>
    <div class="drawer-tabs">
      <button type="button" data-tab="sources" class="tab active">Sources</button>
      <button type="button" data-tab="raw" class="tab">Raw text the model read</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
  <div id="tooltip" class="tooltip" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
