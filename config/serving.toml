# Every llama-server setting, one table per model (design_docs/v2/02_inference_engine.md section 3.5). `uv run serving show` prints the command
# this file produces; `uv run serving launch` checks the model's hash and runs it. Unknown keys stop the launch rather than being passed through.

[server]
host = "127.0.0.1"
port = 8090
api_key_file = "~/Library/Application Support/studio-assistant/llama-server.key"
model = "gemma-4-e4b"                       # which table below is served

[models.gemma-4-e4b]
gguf = "~/models/gguf/gemma-4-E4B_q4_0-it.gguf"
source = "google/gemma-4-E4B-it-qat-q4_0-gguf"
revision = "4b4a2c1d584be7264f87aac328a1bc739ce81b6c"
sha256 = "676c35070db6dbe52f93e9c864ee0fba4eddea94b9c875d9cb10daff453fbaee"
context_tokens = 18432                      # -c, the pool both slots share
conversation_tokens = 16384                 # slot 0's share; the harness budgets against it
slots = 2                                   # -np
kv_unified = true                           # --kv-unified
cache_idle_slots = false                    # --no-cache-idle-slots
gpu_layers = "all"                          # -ngl
flash_attention = "on"                      # -fa
prompt_cache_mib = 1024                     # -cram
reasoning = "off"                           # --reasoning
swa_full = false                            # --swa-full

[models.gemma-4-e4b.sampling]               # defaults; the harness may override per request
temperature = 0.7
max_output_tokens = 600

# Benchmark-only: the larger models, compared on llama-server through the same loop. Neither fits a 16 GB machine whole, and on Apple silicon any GPU
# layer makes Metal map the whole file into its working set, which hangs the load. On the CPU the file stays memory-mapped, so macOS reads the
# experts' pages from disk as needed instead of swapping.
[models.gemma-4-26b-a4b]
gguf = "~/models/gguf/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf"
source = "unsloth/gemma-4-26B-A4B-it-GGUF"
revision = "c099eb48e663fd284577b04978a94ffccb261841"
sha256 = "babd1e389d386352f71600765d37390f7dc993fbfad6725caccf996ffe34aecf"
context_tokens = 18432
conversation_tokens = 16384
slots = 2
kv_unified = true
cache_idle_slots = false
gpu_layers = 0
flash_attention = "on"
prompt_cache_mib = 1024
reasoning = "off"
swa_full = false

[models.gemma-4-26b-a4b.sampling]
temperature = 0.7
max_output_tokens = 600

[models.qwen3-6-35b-a3b]
gguf = "~/models/gguf/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf"
source = "unsloth/Qwen3.6-35B-A3B-GGUF"
revision = "a483e9e6cbd595906af30beda3187c2663a1118c"
