# The speech server (speech_server/): Qwen3-ASR turns speech into text, in one MLX process. Kokoro still speaks the answers.
# `scripts/speech_server.sh` builds its environment and starts it. Unknown keys stop the server rather than being ignored.

[server]
host = "0.0.0.0"                             # the Home Assistant VM reaches the port over the bridge
asr_port = 10300                             # Whisper's port, so Home Assistant's Wyoming entry for speech to text stays as it is
mlx_cache_limit_mib = 256                    # freed GPU memory MLX may keep for reuse; anything above goes back to macOS
# Wired memory is RAM macOS may not compress or swap. Unwired, an idle spell let macOS swap out 2.4 GB of the model, and the first transcription
# after 10 minutes took 1.16 and 1.40 s against 0.3 s warm; wired at 3,300 MiB it took 0.43 and 0.41 s (laptop, 2026-11-15, two idle cycles each).
# On macOS 26 and later it holds only while MLX renews it: scripts/services.sh sets MLX_METAL_RESIDENCY_REFRESH_INTERVAL_MS for the speech agent.
mlx_wired_limit_mib = 3300                   # memory MLX keeps wired, so macOS cannot compress or swap the idle model; 0 leaves it to macOS

[asr]
source = "mlx-community/Qwen3-ASR-1.7B-8bit"
revision = "a8379a2e2f9e313c9292cdf1af4055ab56d50d55"
language = "English"                         # empty detects the language; fixed to English until the harness answers in Chinese
context = ""                                 # names and terms that bias what it hears, passed as Qwen3-ASR's system prompt
speech_floor_dbfs = -45.0                    # a recording whose loudest 30 ms is quieter than this has no speech; Qwen3-ASR would invent "Okay."
