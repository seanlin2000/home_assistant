# The harness service's settings (design_docs/v2/04_agent_harness.md section 3.2, v2/10 section 3.1). The model and its window come from
# config/serving.toml; the host names the harness answers to come from HARNESS_ALLOWED_HOSTS, which scripts/services.sh derives from the Mac's address.

[service]
host = "0.0.0.0"                            # Home Assistant runs in its own VM, so the harness must listen on the network
port = 8770
api_key_file = "~/Library/Application Support/studio-assistant/harness.key"
state_file = "~/Library/Application Support/studio-assistant/harness.sqlite3"
tool_server_url = "http://127.0.0.1:8765/mcp"
conversation_quiet_minutes = 5              # Home Assistant forgets a conversation after five quiet minutes; so does the harness

[answer]
temperature = 0.7
word_budget = 200
max_tool_rounds = 4
tool_timeout_seconds = 60.0
