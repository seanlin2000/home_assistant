# Every tool the harness may call, with its tier and whether its output marks the exchange untrusted (design_docs/v2/12 section 3.3, v2/03
# section 3.1). The harness refuses any tool this file does not list, whatever the tool server advertises. Tiers: local, read_public,
# read_private, act. Add a tool only after the checklist in v2/12 section 3.12.

[limits]
max_string_argument_chars = 300             # longer than any spoken query or page address; a longer argument is refused, not cut

[tools.search_and_read]
tier = "read_public"
marks_untrusted = true

[tools.web_search]
tier = "read_public"
marks_untrusted = true

[tools.fetch_page]
tier = "read_public"
marks_untrusted = true

[tools.wikipedia_lookup]
tier = "read_public"
marks_untrusted = true

[tools.weather_forecast]
tier = "read_public"
marks_untrusted = false                     # numbers from Met.no, not text written by strangers

[tools.game_scores]
tier = "read_public"
marks_untrusted = true                      # game notes are free text: benchmark J71's eight-word note was obeyed until it arrived marked (design doc v2/03 section 3.4)

[tools.box_score]
tier = "read_public"
marks_untrusted = true                      # numbers, but under names and game notes from ESPN

[tools.team_roster]
tier = "read_public"
marks_untrusted = true                      # names from ESPN, free text cut to four words

[tools.player_stats]
tier = "read_public"
marks_untrusted = true                      # numbers, but under names from ESPN

[tools.player_matchup]
tier = "read_public"
marks_untrusted = true                      # numbers, but under names and game notes from ESPN

[tools.broadway_shows]
tier = "read_public"
marks_untrusted = true                      # show names and tags written by TodayTix and the producers who list there

[tools.broadway_show_details]
tier = "read_public"
marks_untrusted = true                      # the description too is written by TodayTix and the producers

[tools.calculate]
tier = "local"
marks_untrusted = false

[tools.percent]
tier = "local"
marks_untrusted = false

[tools.convert]
tier = "local"
marks_untrusted = false

[tools.growth_schedule]
tier = "local"
marks_untrusted = false

[tools.energy_cost]
tier = "local"
marks_untrusted = false

[tools.loan_payment]
tier = "local"
marks_untrusted = false

[tools.break_even]
tier = "local"
marks_untrusted = false

[tools.date_math]
tier = "local"
marks_untrusted = false
