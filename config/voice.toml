# The voice that speaks the answers: OmniVoice (voice_server/, on mlx-audio) or Kokoro. The voice agent runs `voice launch`, which starts whichever
# engine names, so switching is a restart (scripts/services.sh voice-engine switches one Mac without a commit). Kept apart from config/speech.toml
# so a voice change never restarts Qwen3-ASR. Unknown keys stop the voice rather than being ignored.

[voice]
engine = "omnivoice"                         # "omnivoice" or "kokoro"; scripts/services.sh can override it on one Mac
host = "0.0.0.0"                             # the Home Assistant VM reaches the port over the bridge
port = 10210                                 # Kokoro's port, so Home Assistant's Wyoming entry for text to speech stays as it is

# OmniVoice exactly as the Studio load test of 2026-11-20 measured it: no swap beside Flash Next and Qwen3-ASR, about 0.9 s per sentence, and no
# lost or invented words across 2,724 read back by Qwen3-ASR.
[voice.omnivoice]
source = "mlx-community/OmniVoice-bf16"
revision = "8fb0b754cad788aaefec690cd55c207e8a628f85"
reference_clip = "config/voices/jarvis/reference.wav"   # 8.9 s, cleaned of its music and noise; relative to the project
reference_text = "Allow me to introduce myself. I am Jarvis, a virtual artificial intelligence, and I'm here to assist you with a variety of tasks as best I can."
reference_max_seconds = 20.0                 # mlx-audio's 10 s default would cut a longer clip without saying so
steps = 32                                   # OmniVoice's own sampler; 16 was faster and audibly rougher
language = "English"
loudness_dbfs = -20.0                        # each piece levelled to Kokoro's loudness (its voiced RMS); OmniVoice comes out about 2 dB louder
# Each piece is trimmed to its speech, then given this much silence before and after; the gap between sentences comes out near Kokoro's 0.45 s.
lead_silence_seconds = 0.1
trail_silence_seconds = 0.35
# A filler or notice ends in this much inaudible noise instead, since the wait for the answer follows it. The puck's firmware (ESPHome 2026.6.0)
# holds back up to the last 8 KB of a stream that has run dry; this tail is worth about 11 KB once Home Assistant encodes it (measured 2026-11-21).
filler_trail_seconds = 0.75
mlx_cache_limit_mib = 256                    # freed GPU memory MLX may keep for reuse; anything above goes back to macOS
# Wired as the speech server wires Qwen3-ASR, so an idle spell cannot swap the model out; the agent sets MLX_METAL_RESIDENCY_REFRESH_INTERVAL_MS.
mlx_wired_limit_mib = 3400

# Kokoro as it ran before OmniVoice (voice/kokoro_server.py), kept one setting away.
[voice.kokoro]
voice = "bm_fable"
data_dir = "~/.cache/wyoming-kokoro"
volume = 2.0                                 # +6 dB brings answers level with the speaker's wake sound; Kokoro lowers a sentence that would clip
device = "cpu"
